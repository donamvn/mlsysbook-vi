<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <text x="380" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Đồng bộ rào chắn so với tác vụ độc lập</text>

  <!-- MapReduce Panel -->
  <rect x="20" y="40" width="340" height="460" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>

  <text x="190" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#333">MapReduce</text>
  <text x="190" y="90" text-anchor="middle" font-size="9.5" fill="#555">Tác vụ độc lập · Không rào chắn</text>

  <rect x="60" y="120" width="120" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="120" y="136" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Worker A</text>
  <text x="120" y="150" text-anchor="middle" font-size="8.5" fill="#555">Phân vùng tác vụ 1</text>

  <rect x="60" y="180" width="120" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="120" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Worker B</text>
  <text x="120" y="210" text-anchor="middle" font-size="8.5" fill="#555">Phân vùng tác vụ 2</text>

  <rect x="60" y="240" width="120" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="120" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Worker C</text>
  <text x="120" y="270" text-anchor="middle" font-size="8.5" fill="#555">Phân vùng tác vụ 3</text>

  <!-- MR Arrows -->
  <path d="M 180 140 L 290 140 L 290 290" fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 180 200 L 260 200 L 260 290" fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 180 260 L 230 260 L 230 290" fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- MR Shared Storage -->
  <rect x="210" y="290" width="120" height="50" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="270" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Bộ nhớ chia sẻ</text>
  <text x="270" y="326" text-anchor="middle" font-size="8.5" fill="#555">HDFS · S3 · GCS</text>

  <!-- MR Summary Box -->
  <rect x="40" y="360" width="300" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
  <text x="190" y="384" text-anchor="middle" font-size="9" font-weight="700" fill="#3d9e5a">Các Worker hoàn toàn độc lập — không cần rào chắn</text>

  <!-- MR Bullets -->
  <text x="40" y="420" font-size="8.5" fill="#555">• Worker C hoàn thành muộn: A và B đã ghi đầu ra</text>
  <text x="40" y="436" font-size="8.5" fill="#555">• Lỗi ở Worker C: tác vụ tiếp tục không cần nó</text>
  <text x="40" y="452" font-size="8.5" fill="#555">• Mở rộng bằng thêm worker: không tốn chi phí đồng bộ</text>

  <!-- Center divider -->
  <line x1="380" y1="40" x2="380" y2="500" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- ML Fleet Panel -->
  <rect x="400" y="40" width="340" height="460" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>

  <text x="570" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Đội ML</text>
  <text x="570" y="90" text-anchor="middle" font-size="9.5" fill="#555">Đồng bộ rào chắn · AllReduce</text>

  <rect x="430" y="120" width="120" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="490" y="136" text-anchor="middle" font-size="10" font-weight="700" fill="#333">GPU Worker 0</text>
  <text x="490" y="150" text-anchor="middle" font-size="8.5" fill="#555">Gradient: sẵn sàng ✓</text>

  <rect x="430" y="180" width="120" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="490" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#333">GPU Worker 1</text>
  <text x="490" y="210" text-anchor="middle" font-size="8.5" fill="#555">Gradient: sẵn sàng ✓</text>

  <rect x="430" y="240" width="120" height="40" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
  <text x="490" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#a31f34">GPU Worker 2</text>
  <text x="490" y="270" text-anchor="middle" font-size="8.5" fill="#a31f34">Tiến trình chậm — chậm 10%</text>

  <!-- ML Arrows -->
  <path d="M 550 140 L 590 140 L 590 190 L 600 190" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 550 200 L 600 200" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 550 260 L 590 260 L 590 210 L 600 210" fill="none" stroke="#a31f34" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow-red)"/>

  <!-- Wait text -->
  <text x="570" y="134" text-anchor="middle" font-size="8" fill="#a31f34" font-style="italic">CHỜ</text>
  <text x="570" y="194" text-anchor="middle" font-size="8" fill="#a31f34" font-style="italic">CHỜ</text>

  <!-- AllReduce -->
  <rect x="600" y="180" width="120" height="60" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="660" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#c87b2a">AllReduce</text>
  <text x="660" y="216" text-anchor="middle" font-size="8.5" fill="#555">Rào chắn: TẤT CẢ phải</text>
  <text x="660" y="230" text-anchor="middle" font-size="8.5" fill="#555">đến trước khi đồng bộ</text>

  <!-- ML Summary Box -->
  <rect x="420" y="360" width="300" height="40" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="570" y="376" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a31f34">Một tiến trình chậm 10% làm chậm toàn cụm 10%</text>
  <text x="570" y="392" text-anchor="middle" font-size="8.5" fill="#555">9.999 GPU chờ một nút chậm</text>

  <!-- ML Bullets -->
  <text x="420" y="420" font-size="8.5" fill="#555">• Tiến trình chậm ở Worker 2: Worker 0 và 1 rảnh tại rào chắn</text>
  <text x="420" y="436" font-size="8.5" fill="#555">• Lỗi ở bất kỳ worker nào: toàn bộ bước huấn luyện phải khởi động lại</text>
  <text x="420" y="452" font-size="8.5" fill="#555">• Thêm worker: tăng lưu lượng chung và chi phí rào chắn</text>
  <text x="420" y="468" font-size="8.5" fill="#555">• 700 GB gradient được truyền mỗi bước cho GPT-3</text>

  <!-- Footer text -->
  <text x="380" y="520" text-anchor="middle" font-size="9" font-style="italic" fill="#999">Huấn luyện ML kết nối tất cả worker ở mỗi bước; worker MapReduce độc lập thống kê.</text>
</svg>