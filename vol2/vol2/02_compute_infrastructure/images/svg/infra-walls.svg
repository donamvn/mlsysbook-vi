<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460">
  <defs>
    <marker id="road-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fff"/>

  <!-- Road / timeline base -->
  <rect x="20" y="240" width="640" height="20" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
  <line x1="20" y1="250" x2="640" y2="250" stroke="#bbb" stroke-width="0.8" stroke-dasharray="8,6"/>
  <line x1="640" y1="250" x2="655" y2="250" stroke="#999" stroke-width="1.2" marker-end="url(#road-arr)"/>
  <text x="340" y="280" text-anchor="middle" font-size="9" fill="#999" font-weight="600">HÀNH TRÌNH MỞ RỘNG</text>

  <!-- Wall 1: Power Wall -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="120" height="180" fill="#cfe2f3"/>
    <rect x="0" y="0" width="120" height="30" fill="#4a90c4"/>
    <rect x="0" y="10" width="120" height="20" fill="#4a90c4"/>
    <rect x="0" y="0" width="120" height="180" fill="none" stroke="#4a90c4" stroke-width="1.4"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Giới hạn công suất</text>
    <text x="60" y="52" text-anchor="middle" font-size="9" fill="#555" font-weight="600">Công suất trung tâm dữ liệu</text>
    <text x="60" y="66" text-anchor="middle" font-size="9" fill="#555" font-weight="600">giới hạn phân phối</text>
    <line x1="10" y1="80" x2="110" y2="80" stroke="#4a90c4" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="102" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">Cơ sở ~40 MW</text>
    <text x="60" y="116" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">PUE 1.1 -- 1.5</text>
    <line x1="10" y1="130" x2="110" y2="130" stroke="#4a90c4" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="146" text-anchor="middle" font-size="8.5" fill="#555">Giảm thiểu:</text>
    <text x="60" y="158" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">Làm mát bằng chất lỏng,</text>
    <text x="60" y="170" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">Phân phối DC 48V</text>
  </g>

  <!-- Wall 2: Memory Wall -->
  <g transform="translate(200, 40)">
    <rect x="0" y="0" width="120" height="180" fill="#d4edda"/>
    <rect x="0" y="0" width="120" height="30" fill="#3d9e5a"/>
    <rect x="0" y="10" width="120" height="20" fill="#3d9e5a"/>
    <rect x="0" y="0" width="120" height="180" fill="none" stroke="#3d9e5a" stroke-width="1.4"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Giới hạn bộ nhớ</text>
    <text x="60" y="52" text-anchor="middle" font-size="9" fill="#555" font-weight="600">Khoảng cách băng thông HBM</text>
    <text x="60" y="66" text-anchor="middle" font-size="9" fill="#555" font-weight="600">so với tăng trưởng tính toán</text>
    <line x1="10" y1="80" x2="110" y2="80" stroke="#3d9e5a" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="102" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">HBM3 3.35 TB/s</text>
    <text x="60" y="116" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">so với 2K TFLOP/s</text>
    <line x1="10" y1="130" x2="110" y2="130" stroke="#3d9e5a" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="146" text-anchor="middle" font-size="8.5" fill="#555">Giảm thiểu:</text>
    <text x="60" y="158" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">Xếp chồng HBM,</text>
    <text x="60" y="170" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">Bộ đệm SRAM trên chip</text>
  </g>

  <!-- Wall 3: Communication Wall -->
  <g transform="translate(360, 40)">
    <rect x="0" y="0" width="120" height="180" fill="#fdebd0"/>
    <rect x="0" y="0" width="120" height="30" fill="#c87b2a"/>
    <rect x="0" y="10" width="120" height="20" fill="#c87b2a"/>
    <rect x="0" y="0" width="120" height="180" fill="none" stroke="#c87b2a" stroke-width="1.4"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Giới hạn truyền thông</text>
    <text x="60" y="52" text-anchor="middle" font-size="9" fill="#555" font-weight="600">Phân đôi mạng</text>
    <text x="60" y="66" text-anchor="middle" font-size="9" fill="#555" font-weight="600">giới hạn băng thông</text>
    <line x1="10" y1="80" x2="110" y2="80" stroke="#c87b2a" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="102" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">NDR IB 400 Gb/s</text>
    <text x="60" y="116" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">mỗi cổng</text>
    <line x1="10" y1="130" x2="110" y2="130" stroke="#c87b2a" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="146" text-anchor="middle" font-size="8.5" fill="#555">Giảm thiểu:</text>
    <text x="60" y="158" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">Cấu trúc liên kết Fat-tree,</text>
    <text x="60" y="170" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">nén gradient</text>
  </g>

  <!-- Wall 4: Reliability Wall -->
  <g transform="translate(520, 40)">
    <rect x="0" y="0" width="120" height="180" fill="#f9d6d5"/>
    <rect x="0" y="0" width="120" height="30" fill="#c44"/>
    <rect x="0" y="10" width="120" height="20" fill="#c44"/>
    <rect x="0" y="0" width="120" height="180" fill="none" stroke="#c44" stroke-width="1.4"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Giới hạn độ tin cậy</text>
    <text x="60" y="52" text-anchor="middle" font-size="9" fill="#555" font-weight="600">MTBF giảm</text>
    <text x="60" y="66" text-anchor="middle" font-size="9" fill="#555" font-weight="600">với quy mô đội</text>
    <line x1="10" y1="80" x2="110" y2="80" stroke="#c44" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="102" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">MTBF ~ 2 giờ</text>
    <text x="60" y="116" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="700">với 25K GPU</text>
    <line x1="10" y1="130" x2="110" y2="130" stroke="#c44" stroke-width="0.4" opacity="0.5"/>
    <text x="60" y="146" text-anchor="middle" font-size="8.5" fill="#555">Giảm thiểu:</text>
    <text x="60" y="158" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">checkpointing bất đồng bộ,</text>
    <text x="60" y="170" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">phục hồi tự động</text>
  </g>

  <!-- Bottom annotations -->
  <text x="100" y="310" text-anchor="middle" font-size="8.5" fill="#4a90c4" font-weight="600">Nút đơn</text>
  <text x="260" y="310" text-anchor="middle" font-size="8.5" fill="#3d9e5a" font-weight="600">Nút 8 GPU</text>
  <text x="420" y="310" text-anchor="middle" font-size="8.5" fill="#c87b2a" font-weight="600">Cụm đa nút</text>
  <text x="580" y="310" text-anchor="middle" font-size="8.5" fill="#c44" font-weight="600">Đội 10K+ GPU</text>

  <!-- Scale indicator at bottom -->
  <line x1="40" y1="340" x2="640" y2="340" stroke="#bbb" stroke-width="0.8"/>
  <rect x="37" y="337" width="6" height="6" fill="#999"/>
  <text x="40" y="360" text-anchor="middle" font-size="8" fill="#999">1 GPU</text>

  <rect x="197" y="337" width="6" height="6" fill="#999"/>
  <text x="200" y="360" text-anchor="middle" font-size="8" fill="#999">8 GPU</text>

  <rect x="357" y="337" width="6" height="6" fill="#999"/>
  <text x="360" y="360" text-anchor="middle" font-size="8" fill="#999">1.000 GPU</text>

  <rect x="517" y="337" width="6" height="6" fill="#999"/>
  <text x="520" y="360" text-anchor="middle" font-size="8" fill="#999">25.000 GPU</text>

  <!-- Dominance note -->
  <rect x="170" y="390" width="340" height="30" fill="#fff" stroke="#a31f34" stroke-width="1.0"/>
  <text x="340" y="410" text-anchor="middle" font-size="9" fill="#a31f34" font-weight="600">Mỗi giới hạn tạo ra ràng buộc chính ở cấp độ quy mô của nó</text>
</svg>