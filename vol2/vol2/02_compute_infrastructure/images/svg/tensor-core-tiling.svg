<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 880 580">
  <rect width="880" height="580" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c87b2a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90c4"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="440" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Tensor Core tiling: tại sao tính cục bộ của dữ liệu thúc đẩy thông lượng</text>

  <!-- ===== Left: Large Matrix in HBM ===== -->
  <text x="210" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Ma trận trọng số lớn (HBM)</text>
  <text x="210" y="80" text-anchor="middle" font-size="10" fill="#555">Không thể chứa trong SRAM trên chip</text>

  <!-- Large matrix grid -->
  <g transform="translate(30,100)">
    <!-- All tiles in neutral color first -->
    <rect x="0" y="0" width="360" height="300" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>

    <!-- Draw grid lines -->
    <line x1="0" y1="50" x2="360" y2="50" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="360" y2="100" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="360" y2="150" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="360" y2="200" stroke="#bbb" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="360" y2="250" stroke="#bbb" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="300" stroke="#bbb" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="300" stroke="#bbb" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="300" stroke="#bbb" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="300" stroke="#bbb" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#bbb" stroke-width="0.5"/>

    <!-- Highlighted active tile -->
    <rect x="120" y="100" width="60" height="50" fill="#d4edda" stroke="#3d9e5a" stroke-width="2"/>
    <text x="150" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#3d9e5a">Hoạt động</text>
    <text x="150" y="136" text-anchor="middle" font-size="9" fill="#3d9e5a">Ô</text>

    <!-- Processed tiles (greyed out) -->
    <rect x="0" y="0" width="60" height="50" fill="#e8f5e9" stroke="#3d9e5a" stroke-width="1" opacity="0.6"/>
    <rect x="60" y="0" width="60" height="50" fill="#e8f5e9" stroke="#3d9e5a" stroke-width="1" opacity="0.6"/>
    <rect x="120" y="0" width="60" height="50" fill="#e8f5e9" stroke="#3d9e5a" stroke-width="1" opacity="0.6"/>
    <rect x="0" y="50" width="60" height="50" fill="#e8f5e9" stroke="#3d9e5a" stroke-width="1" opacity="0.6"/>
    <rect x="60" y="50" width="60" height="50" fill="#e8f5e9" stroke="#3d9e5a" stroke-width="1" opacity="0.6"/>
    <text x="150" y="78" text-anchor="middle" font-size="10" fill="#3d9e5a">✓</text>

    <!-- Labels: row/col annotations -->
    <text x="180" y="-12" text-anchor="middle" font-size="9" fill="#999">4096 cột</text>
    <text x="-12" y="150" text-anchor="middle" font-size="9" fill="#999" transform="rotate(-90,-12,150)">4096 hàng</text>
  </g>

  <!-- Matrix label -->
  <text x="210" y="425" text-anchor="middle" font-size="10" fill="#555">Một ô = ma trận 16×16</text>
  <text x="210" y="440" text-anchor="middle" font-size="10" fill="#555">tải từ HBM mỗi bước</text>

  <!-- Separator arrow -->
  <line x1="400" y1="225" x2="440" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="215" text-anchor="middle" font-size="9" fill="#555">Tải</text>
  <text x="420" y="240" text-anchor="middle" font-size="9" fill="#555">ô</text>

  <!-- ===== Center: Tile detail zoom ===== -->
  <text x="550" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Thao tác ô (SRAM trên chip)</text>

  <!-- SRAM container -->
  <rect x="450" y="90" width="200" height="280" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="550" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#3d9e5a">SRAM (Bộ nhớ chia sẻ)</text>
  <text x="550" y="130" text-anchor="middle" font-size="9" fill="#555">~33 MB tổng cộng trên H100</text>

  <!-- Tile A and B in SRAM -->
  <rect x="460" y="145" width="80" height="70" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="500" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#4a90c4">Ô A</text>
  <text x="500" y="190" text-anchor="middle" font-size="9" fill="#555">đầu vào 16×16</text>
  <text x="500" y="205" text-anchor="middle" font-size="9" fill="#555">activations</text>

  <rect x="560" y="145" width="80" height="70" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="600" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#4a90c4">Ô B</text>
  <text x="600" y="190" text-anchor="middle" font-size="9" fill="#555">trọng số 16×16</text>
  <text x="600" y="205" text-anchor="middle" font-size="9" fill="#555">ma trận</text>

  <!-- MAC unit -->
  <rect x="480" y="240" width="140" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="550" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#4a90c4">Tensor Core</text>
  <text x="550" y="278" text-anchor="middle" font-size="9" fill="#555">Y = A × B + C</text>
  <text x="550" y="291" text-anchor="middle" font-size="8.3" fill="#555">4096 MACs mỗi ô</text>
  <text x="550" y="304" text-anchor="middle" font-size="8" fill="#555">(16×16×16)</text>

  <!-- Output accumulator -->
  <rect x="490" y="320" width="120" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
  <text x="550" y="338" text-anchor="middle" font-size="10" font-weight="700" fill="#3d9e5a">Bộ tích lũy</text>
  <text x="550" y="352" text-anchor="middle" font-size="9" fill="#555">tổng riêng phần FP32</text>

  <!-- Arrows within tile -->
  <path d="M 500 215 V 225 H 530 V 240" fill="none" stroke="#4a90c4" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <path d="M 600 215 V 225 H 570 V 240" fill="none" stroke="#4a90c4" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <line x1="550" y1="300" x2="550" y2="320" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- ===== Energy cost annotations ===== -->
  <!-- HBM load cost -->
  <line x1="390" y1="140" x2="450" y2="140" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="700" y="110" width="150" height="60" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="775" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#c44">Chi phí tải HBM</text>
  <text x="775" y="146" text-anchor="middle" font-size="10" fill="#555">~2–5 pJ / bit</text>
  <text x="775" y="160" text-anchor="middle" font-size="9" fill="#555">(truy cập DRAM ngoài chip)</text>

  <rect x="700" y="180" width="150" height="60" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
  <text x="775" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#3d9e5a">Chi phí truy cập SRAM</text>
  <text x="775" y="216" text-anchor="middle" font-size="10" fill="#555">~0.1–0.5 pJ / bit</text>
  <text x="775" y="230" text-anchor="middle" font-size="9" fill="#555">(bộ nhớ chia sẻ trên chip)</text>

  <rect x="700" y="250" width="150" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="775" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#4a90c4">Chi phí MAC</text>
  <text x="775" y="286" text-anchor="middle" font-size="10" fill="#555">~1 pJ / thao tác</text>
  <text x="775" y="300" text-anchor="middle" font-size="9" fill="#555">(tính toán cấp thanh ghi)</text>

  <!-- Key insight box -->
  <rect x="700" y="320" width="150" height="80" fill="#a31f34" stroke="#a31f34" stroke-width="0"/>
  <text x="775" y="343" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Khoảng cách năng lượng 10×+</text>
  <text x="775" y="359" text-anchor="middle" font-size="9.5" fill="#fff">Truy cập HBM so với SRAM</text>
  <text x="775" y="374" text-anchor="middle" font-size="9" fill="#fff">thúc đẩy yêu cầu tiling</text>
  <text x="775" y="388" text-anchor="middle" font-size="9" fill="#fff">→ tái sử dụng mỗi ô đã tải</text>

  <!-- Write-back arrow -->
  <line x1="550" y1="360" x2="550" y2="430" stroke="#555" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="565" y="395" font-size="9" fill="#555">ghi kết quả</text>
  <text x="565" y="410" font-size="9" fill="#555">vào HBM</text>
  <rect x="470" y="430" width="160" height="30" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="550" y="450" text-anchor="middle" font-size="10" fill="#555">Ô đầu ra → HBM</text>

  <!-- Tiling insight -->
  <rect x="30" y="470" width="360" height="60" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/>
  <text x="210" y="492" text-anchor="middle" font-size="11" font-weight="700" fill="#c87b2a">Chiến lược Tiling</text>
  <text x="210" y="507" text-anchor="middle" font-size="10" fill="#555">Tải một lần từ HBM → tái sử dụng trong SRAM</text>
  <text x="210" y="522" text-anchor="middle" font-size="10" fill="#555">Cường độ số học cao → giới hạn bởi tính toán</text>

  <text x="440" y="560" text-anchor="middle" font-size="10" fill="#999" font-style="italic">Mỗi ô được tải từ HBM một lần (2–5 pJ/bit) sau đó được tái sử dụng cho nhiều thao tác MAC (1 pJ mỗi thao tác), làm giảm chi phí truy cập bộ nhớ.</text>
</svg>