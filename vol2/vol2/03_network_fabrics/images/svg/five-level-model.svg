<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 500">
  <rect width="680" height="500" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Mô hình mạng năm cấp cho huấn luyện ML</text>

  <!-- ===== Level 5: Cluster Design (Compute blue) ===== -->
  <rect x="60" y="50" width="560" height="70" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="80" y="70" font-size="11" font-weight="700" fill="#4a90c4">Cấp 5 — thiết kế cụm</text>
  <text x="80" y="90" font-size="9.5" font-weight="700" fill="#333">SuperPOD · Grand Teton · tích hợp fabric sản xuất</text>
  <text x="80" y="110" font-size="9" fill="#555">Đặt tác vụ · miền lỗi · đấu dây đa rail · vận hành</text>
  <!-- Badge -->
  <rect x="560" y="60" width="40" height="20" fill="#a31f34"/>
  <text x="580" y="74" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">L5</text>

  <!-- ===== Level 4: Fabric Behavior (Data green) ===== -->
  <rect x="60" y="130" width="560" height="70" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="80" y="150" font-size="11" font-weight="700" fill="#3d9e5a">Cấp 4 — hành vi fabric</text>
  <text x="80" y="170" font-size="9.5" font-weight="700" fill="#333">PFC · DCQCN · HPCC · định tuyến thích ứng</text>
  <text x="80" y="190" font-size="9" fill="#555">Lan truyền tắc nghẽn · incast · độ trễ đuôi · tắc nghẽn toàn fabric</text>
  <!-- Badge -->
  <rect x="560" y="140" width="40" height="20" fill="#a31f34"/>
  <text x="580" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">L4</text>

  <!-- ===== Level 3: Switch and Topology (Routing orange) ===== -->
  <rect x="60" y="210" width="560" height="70" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="80" y="230" font-size="11" font-weight="700" fill="#c87b2a">Cấp 3 — switch và topo</text>
  <text x="80" y="250" font-size="9.5" font-weight="700" fill="#333">Fat-tree · tối ưu rail · Dragonfly · radix switch</text>
  <text x="80" y="270" font-size="9" fill="#555">Băng thông phân đôi · số bước nhảy · ECMP · chọn topo</text>
  <!-- Badge -->
  <rect x="560" y="220" width="40" height="20" fill="#a31f34"/>
  <text x="580" y="234" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">L3</text>

  <!-- ===== Level 2: Transport (Neutral) ===== -->
  <rect x="60" y="290" width="560" height="70" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <text x="80" y="310" font-size="11" font-weight="700" fill="#555">Cấp 2 — vận chuyển</text>
  <text x="80" y="330" font-size="9.5" font-weight="700" fill="#333">RDMA · GPUDirect · RoCEv2 · mô hình α-β</text>
  <text x="80" y="350" font-size="9" fill="#555">DMA không sao chép · API verbs · hành vi truyền lại · thuật ngữ độ trễ/băng thông</text>
  <!-- Badge -->
  <rect x="560" y="300" width="40" height="20" fill="#a31f34"/>
  <text x="580" y="314" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">L2</text>

  <!-- ===== Level 1: Wire and Link (Neutral) ===== -->
  <rect x="60" y="370" width="560" height="70" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <text x="80" y="390" font-size="11" font-weight="700" fill="#555">Cấp 1 — dây và liên kết</text>
  <text x="80" y="410" font-size="9.5" font-weight="700" fill="#333">PAM4 / NRZ · SerDes · DAC · AOC · quang học cắm được</text>
  <text x="80" y="430" font-size="9" fill="#555">Liên kết Ethernet/InfiniBand · FEC · ngân sách liên kết · tầm cáp · tín hiệu trên nhiễu</text>
  <!-- Badge -->
  <rect x="560" y="380" width="40" height="20" fill="#a31f34"/>
  <text x="580" y="394" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">L1</text>

  <!-- Vertical direction arrow -->
  <line x1="30" y1="440" x2="30" y2="50" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="250" text-anchor="middle" font-size="9" fill="#555" transform="rotate(-90, 20, 250)">Độ trừu tượng tăng →</text>

  <!-- Bottom footnote -->
  <text x="340" y="470" text-anchor="middle" font-size="9" fill="#999" font-style="italic">Mô hình chương đi từ cơ chế dây/liên kết qua vận chuyển, topo, hành vi fabric và thiết kế cụm.</text>
</svg>