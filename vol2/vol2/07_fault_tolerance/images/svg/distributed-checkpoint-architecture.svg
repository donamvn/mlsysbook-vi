<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 860 580">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="580" fill="#fff"/>

  <!-- ===== Left panel: Centralized checkpointing ===== -->
  <rect x="20" y="20" width="390" height="500" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
  <text x="215" y="40" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#a31f34">Checkpoint tập trung</text>
  <text x="215" y="60" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#555">Mọi worker ghi qua 1 coordinator</text>

  <!-- Left: Compute nodes (workers) -->
  <rect x="40" y="90" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="80" y="100" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 0</text>
  <text x="80" y="120" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 0</text>

  <rect x="40" y="150" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="80" y="160" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 1</text>
  <text x="80" y="180" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 1</text>

  <rect x="40" y="210" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="80" y="220" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 2</text>
  <text x="80" y="240" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 2</text>

  <rect x="40" y="270" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="80" y="280" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 3</text>
  <text x="80" y="300" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 3</text>

  <!-- Left: Orthogonal routing arrows to coordinator -->
  <path d="M 120 110 L 140 110 L 140 180 L 200 180" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 120 170 L 160 170 L 160 190 L 200 190" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 120 230 L 160 230 L 160 210 L 200 210" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 120 290 L 140 290 L 140 220 L 200 220" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Left: Coordinator / bottleneck box -->
  <rect x="200" y="160" width="100" height="80" fill="#f9d6d5" stroke="#c44" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#c44">Coordinator</text>
  <text x="250" y="210" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#c44">NÚT THẮT</text>

  <!-- Left: Arrow coordinator to PFS -->
  <line x1="300" y1="200" x2="330" y2="200" stroke="#a31f34" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- Left: PFS -->
  <rect x="330" y="170" width="60" height="60" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="360" y="180" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#c87b2a">PFS</text>
  <text x="360" y="200" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">chia sẻ</text>
  <text x="360" y="220" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">lưu trữ</text>

  <!-- Left: Problem annotations -->
  <rect x="40" y="330" width="350" height="170" fill="#fff" stroke="#c44" stroke-width="1"/>
  <text x="215" y="350" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#c44">Phân tích nút thắt</text>
  <text x="60" y="370" dominant-baseline="middle" font-size="12" fill="#555">• Mọi trạng thái qua 1 tiến trình</text>
  <text x="60" y="390" dominant-baseline="middle" font-size="12" fill="#555">• Bộ nhớ coordinator = checkpoint đầy đủ</text>
  <text x="60" y="410" dominant-baseline="middle" font-size="12" fill="#555">• Mạng: mọi worker → 1 coordinator</text>
  <text x="60" y="430" dominant-baseline="middle" font-size="12" fill="#555">• Điểm lỗi đơn tại coordinator</text>
  <text x="60" y="450" dominant-baseline="middle" font-size="12" font-weight="700" fill="#a31f34">Thời gian ghi tăng theo số worker</text>
  <text x="60" y="470" dominant-baseline="middle" font-size="12" fill="#555">1.000 worker @ 1 GB/s mỗi worker =</text>
  <text x="60" y="490" dominant-baseline="middle" font-size="12" font-weight="700" fill="#a31f34">Cần 1 TB/s đầu vào coordinator</text>

  <!-- ===== Vertical divider ===== -->
  <path d="M 430 20 L 430 520" fill="none" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="1"/>

  <!-- ===== Right panel: Distributed/sharded checkpointing ===== -->
  <rect x="450" y="20" width="390" height="500" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
  <text x="645" y="40" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#3d9e5a">Checkpoint phân tán</text>
  <text x="645" y="60" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#555">Mỗi worker ghi shard vào NVMe cục bộ, tải lên bất đồng bộ</text>

  <!-- Right: Compute nodes with local NVMe -->
  <rect x="470" y="90" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="510" y="100" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 0</text>
  <text x="510" y="120" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 0</text>

  <rect x="470" y="150" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="510" y="160" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 1</text>
  <text x="510" y="180" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 1</text>

  <rect x="470" y="210" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="510" y="220" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 2</text>
  <text x="510" y="240" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 2</text>

  <rect x="470" y="270" width="80" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="510" y="280" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#333">Worker 3</text>
  <text x="510" y="300" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">shard 3</text>

  <!-- Right: Local NVMe boxes -->
  <rect x="590" y="90" width="80" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="630" y="100" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#3d9e5a">NVMe 0</text>
  <text x="630" y="120" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">cục bộ nhanh</text>

  <rect x="590" y="150" width="80" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="630" y="160" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#3d9e5a">NVMe 1</text>
  <text x="630" y="180" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">cục bộ nhanh</text>

  <rect x="590" y="210" width="80" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="630" y="220" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#3d9e5a">NVMe 2</text>
  <text x="630" y="240" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">cục bộ nhanh</text>

  <rect x="590" y="270" width="80" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="630" y="280" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#3d9e5a">NVMe 3</text>
  <text x="630" y="300" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">cục bộ nhanh</text>

  <!-- Right: Direct worker to local NVMe arrows -->
  <line x1="550" y1="110" x2="590" y2="110" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="170" x2="590" y2="170" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="230" x2="590" y2="230" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="290" x2="590" y2="290" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right: Async upload orthogonal routing (NVMe to object store) -->
  <path d="M 670 110 L 690 110 L 690 180 L 720 180" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <path d="M 670 170 L 700 170 L 700 190 L 720 190" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <path d="M 670 230 L 700 230 L 700 210 L 720 210" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <path d="M 670 290 L 690 290 L 690 220 L 720 220" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Right: Object store / PFS -->
  <rect x="720" y="160" width="80" height="80" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="760" y="180" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#c87b2a">Object</text>
  <text x="760" y="200" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#c87b2a">Store</text>
  <text x="760" y="220" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#555">bất đồng bộ</text>

  <!-- Async labels placed clearly -->
  <text x="760" y="120" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#555" font-style="italic">tải lên bất đồng bộ</text>
  <text x="760" y="140" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#555" font-style="italic">(nền)</text>

  <!-- Right: Benefit annotations -->
  <rect x="470" y="330" width="350" height="170" fill="#fff" stroke="#3d9e5a" stroke-width="1"/>
  <text x="645" y="350" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#3d9e5a">Phân tích thông lượng</text>
  <text x="490" y="370" dominant-baseline="middle" font-size="12" fill="#555">• Mỗi worker chỉ ghi shard của mình</text>
  <text x="490" y="390" dominant-baseline="middle" font-size="12" fill="#555">• NVMe cục bộ: không tranh chấp mạng</text>
  <text x="490" y="410" dominant-baseline="middle" font-size="12" fill="#555">• Tải lên bất đồng bộ chồng chéo tính toán</text>
  <text x="490" y="430" dominant-baseline="middle" font-size="12" fill="#555">• Coordinator chỉ ghi siêu dữ liệu</text>
  <text x="490" y="450" dominant-baseline="middle" font-size="12" font-weight="700" fill="#3d9e5a">Thời gian ghi không đổi mỗi worker</text>
  <text x="490" y="470" dominant-baseline="middle" font-size="12" fill="#555">1.000 worker @ 1 GB/s mỗi worker =</text>
  <text x="490" y="490" dominant-baseline="middle" font-size="12" font-weight="700" fill="#3d9e5a">1 GB/s mỗi worker song song</text>

  <!-- ── Footnote ── -->
  <text x="430" y="550" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#999" font-style="italic">Checkpoint tập trung (trái) tạo nút thắt coordinator; checkpoint phân tán (phải) song song hóa I/O trên mọi worker</text>
</svg>