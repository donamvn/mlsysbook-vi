<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 720 580">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90c4"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c87b2a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="580" fill="#fff"/>

  <!-- ===== Title ===== -->
  <text x="360" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Khả năng quan sát: Ba trụ cột cho Hệ thống ML phân tán</text>

  <!-- ===== Pillar 1: Metrics (blue) ===== -->
  <rect x="20" y="40" width="200" height="310" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#4a90c4">Chỉ số</text>
  <text x="120" y="90" text-anchor="middle" font-size="10" fill="#555">Đo lường số theo thời gian</text>

  <line x1="40" y1="100" x2="200" y2="100" stroke="#4a90c4" stroke-width="0.6" opacity="0.5"/>

  <text x="40" y="120" font-size="10" font-weight="700" fill="#333">Cơ sở hạ tầng</text>
  <text x="40" y="140" font-size="10" fill="#555">• Mức sử dụng GPU / CPU</text>
  <text x="40" y="160" font-size="10" fill="#555">• Cấp phát bộ nhớ (HBM)</text>
  <text x="40" y="180" font-size="10" fill="#555">• Băng thông, độ trễ mạng</text>

  <text x="40" y="210" font-size="10" font-weight="700" fill="#333">Ứng dụng</text>
  <text x="40" y="230" font-size="10" fill="#555">• Độ trễ yêu cầu p50 / p99</text>
  <text x="40" y="250" font-size="10" fill="#555">• Tỷ lệ lỗi theo loại</text>
  <text x="40" y="270" font-size="10" fill="#555">• Độ sâu hàng đợi, tỷ lệ trúng cache</text>

  <text x="40" y="300" font-size="10" font-weight="700" fill="#333">Đặc thù ML</text>
  <text x="40" y="320" font-size="10" fill="#555">• Chuẩn gradient theo rank</text>
  <text x="40" y="340" font-size="10" fill="#555">• Đường cong lỗi, MFU</text>

  <!-- ===== Pillar 2: Logs (green) ===== -->
  <rect x="260" y="40" width="200" height="310" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="360" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#3d9e5a">Nhật ký</text>
  <text x="360" y="90" text-anchor="middle" font-size="10" fill="#555">Sự kiện rời rạc với ngữ cảnh có cấu trúc</text>

  <line x1="280" y1="100" x2="440" y2="100" stroke="#3d9e5a" stroke-width="0.6" opacity="0.5"/>

  <text x="280" y="120" font-size="10" font-weight="700" fill="#333">Mức độ nghiêm trọng</text>
  <text x="280" y="140" font-size="10" fill="#555">• DEBUG: chi tiết chẩn đoán</text>
  <text x="280" y="160" font-size="10" fill="#555">• INFO: sự kiện vận hành</text>
  <text x="280" y="180" font-size="10" fill="#555">• WARN: vấn đề tiềm ẩn</text>
  <text x="280" y="200" font-size="10" fill="#555">• ERROR: lỗi vận hành</text>
  <text x="280" y="220" font-size="10" fill="#555">• FATAL: lỗi toàn hệ thống</text>

  <text x="280" y="250" font-size="10" font-weight="700" fill="#333">Định dạng có cấu trúc (JSON)</text>
  <rect x="280" y="260" width="160" height="90" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
  <text x="300" y="280" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve">{timestamp, level,</text>
  <text x="300" y="300" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve"> trace_id, span_id,</text>
  <text x="300" y="320" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve"> message, gpu_id,</text>
  <text x="300" y="340" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve"> requested_bytes}</text>

  <!-- ===== Pillar 3: Traces (orange) ===== -->
  <rect x="500" y="40" width="200" height="310" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="600" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#c87b2a">Dấu vết</text>
  <text x="600" y="90" text-anchor="middle" font-size="10" fill="#555">Hành trình yêu cầu qua các thành phần</text>

  <line x1="520" y1="100" x2="680" y2="100" stroke="#c87b2a" stroke-width="0.6" opacity="0.5"/>

  <text x="520" y="120" font-size="10" font-weight="700" fill="#333">Khái niệm cốt lõi</text>
  <text x="520" y="140" font-size="10" fill="#555">• Dấu vết: yêu cầu đầu cuối</text>
  <text x="520" y="160" font-size="10" fill="#555">• Span: thao tác dịch vụ đơn lẻ</text>
  <text x="520" y="180" font-size="10" fill="#555">• Ngữ cảnh: ID được truyền</text>

  <text x="520" y="210" font-size="10" font-weight="700" fill="#333">Ví dụ suy luận ML</text>
  <rect x="520" y="220" width="160" height="130" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
  <text x="540" y="240" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve">api-gateway    5ms</text>
  <text x="540" y="260" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve">  feature-svc  15ms</text>
  <text x="540" y="280" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve">  suy luận    45ms</text>
  <text x="540" y="300" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve">    tiền xử lý    3ms</text>
  <text x="540" y="320" font-size="10" fill="#555" font-family="Courier New, monospace" xml:space="preserve">    mô hình      40ms</text>
  <text x="540" y="340" font-size="10" fill="#c87b2a" font-family="Courier New, monospace" font-weight="700" xml:space="preserve">Tổng cộng:         66ms</text>

  <!-- ===== Arrows to central correlation engine ===== -->
  <path d="M120,350 L120,390" fill="none" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M360,350 L360,390" fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M600,350 L600,390" fill="none" stroke="#c87b2a" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ===== Central Correlation and Alerting Engine ===== -->
  <rect x="20" y="390" width="680" height="140" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <text x="360" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Công cụ tương quan và Cảnh báo</text>
  <text x="360" y="440" text-anchor="middle" font-size="10" fill="#555">Phân tích đa tín hiệu: liên kết đột biến chỉ số → sự kiện nhật ký → span dấu vết chậm</text>

  <!-- Sub-boxes inside correlation engine -->
  <rect x="60" y="460" width="160" height="50" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="140" y="480" text-anchor="middle" font-size="10" font-weight="700" fill="#4a90c4">Cảnh báo ngưỡng</text>
  <text x="140" y="500" text-anchor="middle" font-size="10" fill="#555">PagerDuty / OpsGenie</text>

  <rect x="280" y="460" width="160" height="50" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
  <text x="360" y="480" text-anchor="middle" font-size="10" font-weight="700" fill="#3d9e5a">Phát hiện bất thường</text>
  <text x="360" y="500" text-anchor="middle" font-size="10" fill="#555">Đột biến lỗi, ngoại lệ chuẩn grad</text>

  <rect x="500" y="460" width="160" height="50" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/>
  <text x="580" y="480" text-anchor="middle" font-size="10" font-weight="700" fill="#c87b2a">Nguyên nhân gốc</text>
  <text x="580" y="500" text-anchor="middle" font-size="10" fill="#555">Cô lập nút thắt</text>

  <!-- ── Footnote ── -->
  <text x="360" y="560" text-anchor="middle" font-size="10" fill="#999" font-style="italic">Chỉ số, Nhật ký và Dấu vết mỗi loại nắm bắt một chiều khác nhau; công cụ tương quan liên kết chúng để cô lập nguyên nhân gốc trong các lỗi ML phân tán</text>
</svg>