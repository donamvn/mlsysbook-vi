<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 550">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c44"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <rect width="680" height="550" fill="#fff"/>

  <!-- ===== LEFT SIDE: DEADLOCK SCENARIO ===== -->
  <text x="205" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#a31f34">Bế tắc: Bộ lập lịch không theo nhóm</text>
  <text x="205" y="46" text-anchor="middle" font-size="9.5" fill="#555">8 GPU khả dụng, 2 tác vụ mỗi tác vụ cần 8 GPU</text>

  <!-- GPU row -->
  <g>
    <!-- J1 holds 4 GPUs (blue) -->
    <rect x="30" y="60" width="30" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="45" y="79" text-anchor="middle" font-size="9" font-weight="700">G0</text>
    <rect x="70" y="60" width="30" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="85" y="79" text-anchor="middle" font-size="9" font-weight="700">G1</text>
    <rect x="110" y="60" width="30" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="125" y="79" text-anchor="middle" font-size="9" font-weight="700">G2</text>
    <rect x="150" y="60" width="30" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="165" y="79" text-anchor="middle" font-size="9" font-weight="700">G3</text>

    <!-- J2 holds 4 GPUs (pink) -->
    <rect x="230" y="60" width="30" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
    <text x="245" y="79" text-anchor="middle" font-size="9" font-weight="700">G4</text>
    <rect x="270" y="60" width="30" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
    <text x="285" y="79" text-anchor="middle" font-size="9" font-weight="700">G5</text>
    <rect x="310" y="60" width="30" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
    <text x="325" y="79" text-anchor="middle" font-size="9" font-weight="700">G6</text>
    <rect x="350" y="60" width="30" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
    <text x="365" y="79" text-anchor="middle" font-size="9" font-weight="700">G7</text>
  </g>

  <!-- Labels -->
  <text x="105" y="105" text-anchor="middle" font-size="9" fill="#4a90c4" font-weight="700">J1 giữ G0-G3</text>
  <text x="305" y="105" text-anchor="middle" font-size="9" fill="#c44" font-weight="700">J2 giữ G4-G7</text>

  <!-- Job boxes showing what each job wants -->
  <rect x="40" y="120" width="130" height="60" fill="none" stroke="#4a90c4" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="105" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#4a90c4">Tác vụ J1</text>
  <text x="105" y="156" text-anchor="middle" font-size="9" fill="#555">Có 4, cần thêm 4</text>
  <text x="105" y="172" text-anchor="middle" font-size="9" fill="#c44">Tiến độ: 0%</text>

  <rect x="240" y="120" width="130" height="60" fill="none" stroke="#c44" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="305" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#c44">Tác vụ J2</text>
  <text x="305" y="156" text-anchor="middle" font-size="9" fill="#555">Có 4, cần thêm 4</text>
  <text x="305" y="172" text-anchor="middle" font-size="9" fill="#c44">Tiến độ: 0%</text>

  <!-- Circular dependency arrows -->
  <path d="M 170,140 L 240,140" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="205" y="134" text-anchor="middle" font-size="8" fill="#a31f34" font-weight="700">muốn GPU của J2</text>

  <path d="M 240,160 L 170,160" fill="none" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="205" y="174" text-anchor="middle" font-size="8" fill="#a31f34" font-weight="700">muốn GPU của J1</text>

  <!-- J3 waiting -->
  <rect x="130" y="200" width="150" height="30" fill="none" stroke="#c87b2a" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="205" y="219" text-anchor="middle" font-size="9" font-weight="700" fill="#c87b2a">Tác vụ J3: đang chờ (cần 4 GPU, 0 khả dụng)</text>

  <!-- DEADLOCK label -->
  <rect x="150" y="250" width="110" height="30" fill="#a31f34" stroke="none"/>
  <text x="205" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">BẾ TẮC</text>

  <!-- Waste annotation -->
  <rect x="40" y="300" width="330" height="20" fill="#f9d6d5" stroke="#c44" stroke-width="0.8"/>
  <text x="205" y="314" text-anchor="middle" font-size="9" fill="#c44" font-weight="700">8 GPU đã cấp, 0 việc hữu ích. Lãng phí: $16/giờ ($2/GPU-giờ).</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="400" y1="20" x2="400" y2="330" stroke="#e8e8e8" stroke-width="0.8"/>

  <!-- ===== RIGHT SIDE: GANG SCHEDULING SOLUTION ===== -->
  <text x="535" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#3d9e5a">Giải pháp: Bộ lập lịch theo nhóm</text>
  <text x="535" y="46" text-anchor="middle" font-size="9.5" fill="#555">Cấp phát tất cả/không; cấp tài nguyên nguyên tử</text>

  <!-- Step 1: J1 gets the full gang -->
  <text x="535" y="70" text-anchor="middle" font-size="9.5" font-weight="700" fill="#333">Bước 1: Cấp phát J1 nguyên tử</text>
  <rect x="415" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <rect x="444" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <rect x="473" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <rect x="502" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <rect x="531" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <rect x="560" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <rect x="589" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <rect x="618" y="80" width="24" height="30" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="427" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  <text x="456" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  <text x="485" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  <text x="514" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  <text x="543" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  <text x="572" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  <text x="601" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  <text x="630" y="99" text-anchor="middle" font-size="8" fill="#4a90c4" font-weight="700">J1</text>
  
  <!-- check mark -->
  <text x="660" y="70" font-size="12" fill="#3d9e5a">✓</text>

  <!-- Step 2: J2 queued (not enough free) -->
  <text x="535" y="130" text-anchor="middle" font-size="9.5" font-weight="700" fill="#333">Bước 2: J2 xếp hàng (0 trống, cần 8)</text>
  <text x="535" y="145" text-anchor="middle" font-size="9" fill="#555">J2 chờ -- không giữ tài nguyên một phần</text>

  <!-- Step 3: J1 finishes, J2 runs -->
  <text x="535" y="170" text-anchor="middle" font-size="9.5" font-weight="700" fill="#333">Bước 3: J1 hoàn thành, J2 được cấp phát nguyên tử</text>
  <rect x="415" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <rect x="444" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <rect x="473" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <rect x="502" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <rect x="531" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <rect x="560" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <rect x="589" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <rect x="618" y="180" width="24" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="427" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="456" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="485" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="514" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="543" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="572" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="601" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="630" y="199" text-anchor="middle" font-size="8" fill="#c44" font-weight="700">J2</text>
  <text x="660" y="170" font-size="12" fill="#3d9e5a">✓</text>

  <!-- Result annotation -->
  <rect x="430" y="230" width="210" height="30" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.8"/>
  <text x="535" y="250" text-anchor="middle" font-size="9" font-weight="700" fill="#3d9e5a">Không bế tắc. Mọi tác vụ hoàn thành tuần tự.</text>

  <!-- ===== RESOURCE DEPENDENCY GRAPH (bottom) ===== -->
  <rect x="30" y="350" width="620" height="140" fill="#f7f7f7" stroke="#bbb" stroke-width="0.8"/>
  <text x="340" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Đồ thị phụ thuộc tài nguyên (Điều kiện bế tắc)</text>

  <!-- Four conditions -->
  <!-- Mutual exclusion -->
  <rect x="40" y="380" width="120" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="100" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Loại trừ lẫn nhau</text>
  <text x="100" y="410" text-anchor="middle" font-size="8" fill="#555">GPU không chia sẻ được</text>

  <!-- Hold and wait -->
  <rect x="190" y="380" width="120" height="40" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/>
  <text x="250" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Giữ và chờ</text>
  <text x="250" y="410" text-anchor="middle" font-size="8" fill="#555">Tác vụ giữ cấp phát một phần</text>

  <!-- No preemption -->
  <rect x="340" y="380" width="120" height="40" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="400" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Không ưu tiên</text>
  <text x="400" y="410" text-anchor="middle" font-size="8" fill="#555">Không thể thu hồi GPU</text>

  <!-- Circular wait -->
  <rect x="490" y="380" width="150" height="40" fill="#a31f34" stroke="#a31f34" stroke-width="1.2"/>
  <text x="565" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Chờ vòng tròn</text>
  <text x="565" y="410" text-anchor="middle" font-size="8" fill="#fff">J1 chờ J2 chờ J1</text>

  <!-- Arrow chain -->
  <line x1="160" y1="400" x2="190" y2="400" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="310" y1="400" x2="340" y2="400" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="460" y1="400" x2="490" y2="400" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Gang scheduling breaks "Hold and Wait" -->
  <text x="250" y="464" text-anchor="middle" font-size="8" fill="#3d9e5a" font-weight="700">Lập lịch theo nhóm</text>
  <text x="250" y="478" text-anchor="middle" font-size="8" fill="#3d9e5a" font-weight="700">phá vỡ điều kiện này</text>
  <line x1="250" y1="450" x2="250" y2="420" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- Footnote -->
  <text x="340" y="520" text-anchor="middle" font-size="9" fill="#999" font-style="italic">Lập lịch theo nhóm đảm bảo tính nguyên tử: nếu tác vụ không chạy toàn bộ, nó sẽ không chạy.</text>

</svg>