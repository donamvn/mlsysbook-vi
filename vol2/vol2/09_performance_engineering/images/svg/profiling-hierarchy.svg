<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460">
  <rect width="680" height="460" fill="#fff"/>

  <!-- ===== Defs ===== -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a90c4"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c87b2a"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#999"/></marker>

    <marker id="arr-up" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arr-down" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Phân cấp Profiling</text>
  <text x="340" y="44" text-anchor="middle" font-size="10" fill="#555">4 cấp độ chi tiết — chẩn đoán tổng thể, rồi đi sâu tìm nguyên nhân gốc</text>

  <!-- ===== PYRAMID structure (bottom to top = coarse to fine) ===== -->

  <!-- Level 1 (bottom/widest): Hardware Counters -->
  <rect x="30" y="360" width="620" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <rect x="40" y="370" width="60" height="20" fill="#a31f34"/>
  <text x="70" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Cấp độ 1</text>
  <text x="340" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Bộ đếm phần cứng</text>
  <text x="340" y="396" text-anchor="middle" font-size="10" fill="#555">Chỉ số kernel riêng: BW đạt được, chiếm dụng, tỷ lệ lệnh, tỷ lệ trúng cache</text>
  <text x="340" y="410" text-anchor="middle" font-size="9" fill="#4a90c4" font-weight="700">Công cụ: NVIDIA Nsight Compute · Linux perf · PAPI</text>

  <!-- Level 2: Kernel Profiling -->
  <rect x="60" y="280" width="560" height="60" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <rect x="70" y="290" width="60" height="20" fill="#a31f34"/>
  <text x="100" y="304" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Cấp độ 2</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Profiling Kernel</text>
  <text x="340" y="316" text-anchor="middle" font-size="10" fill="#555">Dòng thời gian khởi chạy kernel, khoảng trống GPU nhàn rỗi, đồng bộ CPU–GPU, sự kiện NCCL</text>
  <text x="340" y="330" text-anchor="middle" font-size="9" fill="#3d9e5a" font-weight="700">Công cụ: NVIDIA Nsight Systems · PyTorch Profiler · Chrome Trace Viewer</text>

  <!-- Level 3: Framework Profiling -->
  <rect x="90" y="200" width="500" height="60" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <rect x="100" y="210" width="60" height="20" fill="#a31f34"/>
  <text x="130" y="224" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Cấp độ 3</text>
  <text x="340" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Profiling framework</text>
  <text x="340" y="236" text-anchor="middle" font-size="10" fill="#555">Dấu vết phân tán: AllReduce vs. chồng chéo tính toán, phát hiện nút chậm, mất cân bằng tải</text>
  <text x="340" y="250" text-anchor="middle" font-size="9" fill="#c87b2a" font-weight="700">Công cụ: PyTorch Profiler + NVTX · TensorBoard · W&amp;B Traces</text>

  <!-- Level 4 (top/narrowest): Application Profiling -->
  <rect x="120" y="120" width="440" height="60" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <rect x="130" y="130" width="60" height="20" fill="#a31f34"/>
  <text x="160" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Cấp độ 4</text>
  <text x="340" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Profiling ứng dụng</text>
  <text x="340" y="156" text-anchor="middle" font-size="10" fill="#555">Đầu cuối: token/giây, TTFT, độ trễ P99, MFU, mức sử dụng GPU theo thời gian</text>
  <text x="340" y="170" text-anchor="middle" font-size="9" fill="#555" font-weight="700">Công cụ: Custom dashboards · Prometheus · Grafana · Weights &amp; Biases</text>

  <!-- ===== Pyramid side slopes ===== -->
  <!-- Left slope lines -->
  <line x1="30" y1="360" x2="60" y2="280" stroke="#bbb" stroke-width="0.8"/>
  <line x1="60" y1="280" x2="90" y2="200" stroke="#bbb" stroke-width="0.8"/>
  <line x1="90" y1="200" x2="120" y2="120" stroke="#bbb" stroke-width="0.8"/>
  <!-- Right slope lines -->
  <line x1="650" y1="360" x2="620" y2="280" stroke="#bbb" stroke-width="0.8"/>
  <line x1="620" y1="280" x2="590" y2="200" stroke="#bbb" stroke-width="0.8"/>
  <line x1="590" y1="200" x2="560" y2="120" stroke="#bbb" stroke-width="0.8"/>

  <!-- ===== Left annotation: Direction arrows ===== -->
  <text x="20" y="240" text-anchor="middle" font-size="10" fill="#555" transform="rotate(-90 20 240)">← Bắt đầu từ đây (tổng thể)</text>
  <text x="660" y="240" text-anchor="middle" font-size="10" fill="#555" transform="rotate(90 660 240)">Đi sâu tìm nguyên nhân gốc →</text>

  <!-- ===== Drill-down arrow left ===== -->
  <line x1="340" y1="120" x2="340" y2="80" stroke="#a31f34" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="340" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#a31f34">Triệu chứng tổng thể</text>
  <text x="340" y="76" text-anchor="middle" font-size="10" fill="#555">độ trễ gấp 3 lần SLO</text>
  <line x1="340" y1="96" x2="340" y2="119" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Bottom footnote ===== -->
  <text x="340" y="440" text-anchor="middle" font-size="10" fill="#999" font-style="italic">Bỏ qua cấp độ sẽ tối ưu sai nút thắt. Bắt đầu Cấp độ 4, rồi đi sâu tìm nguyên nhân gốc ở Cấp độ 1.</text>
</svg>