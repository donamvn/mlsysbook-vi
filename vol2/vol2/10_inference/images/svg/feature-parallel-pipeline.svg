<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 490">
  <rect width="100%" height="100%" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c87b2a"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="340" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#333">pipeline đề xuất song song đặc trưng</text>

  <!-- ===== Request (orange) ===== -->
  <rect x="20" y="190" width="80" height="60" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="60" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Yêu cầu</text>
  <text x="60" y="224.5" text-anchor="middle" font-size="8.5" fill="#555">Người dùng + Mục</text>
  <text x="60" y="239.5" text-anchor="middle" font-size="8.5" fill="#555">+ Ngữ cảnh</text>

  <!-- Arrow: Request → Feature Extraction -->
  <line x1="100" y1="220" x2="130" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Feature Extraction box ===== -->
  <rect x="130" y="180" width="100" height="80" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
  <text x="180" y="208" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Đặc trưng</text>
  <text x="180" y="221" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Trích xuất</text>
  <text x="180" y="234.5" text-anchor="middle" font-size="8.5" fill="#555">Phân tích đặc trưng</text>
  <text x="180" y="249.5" text-anchor="middle" font-size="8.5" fill="#555">theo loại</text>

  <!-- Fan-out arrows from Feature Extraction to three embedding tables -->
  <!-- To User Embeddings (top) -->
  <path d="M 230,210 H 250 V 140 H 280" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- To Item Embeddings (middle) -->
  <path d="M 230,220 H 280" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- To Context Embeddings (bottom) -->
  <path d="M 230,230 H 250 V 300 H 280" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Embedding Tables Section Header ===== -->
  <text x="340" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#555">Tra cứu embedding song song (giới hạn bộ nhớ)</text>
  <line x1="260" y1="60" x2="420" y2="60" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- ===== GPU-labeled Embedding Table boxes (blue) ===== -->

  <!-- User Embedding GPU -->
  <rect x="280" y="110" width="120" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="340" y="133.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#333">embeddings người dùng</text>
  <text x="340" y="145" text-anchor="middle" font-size="8.5" fill="#555">user_id, tuổi,</text>
  <text x="340" y="158.5" text-anchor="middle" font-size="8.5" fill="#555">đặc trưng lịch sử</text>
  <!-- GPU badge -->
  <rect x="368" y="114" width="28" height="16" fill="#a31f34"/>
  <text x="382" y="122" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">GPU 0</text>

  <!-- Item Embedding GPU -->
  <rect x="280" y="190" width="120" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="340" y="213.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#333">embeddings mục</text>
  <text x="340" y="225" text-anchor="middle" font-size="8.5" fill="#555">item_id, danh mục,</text>
  <text x="340" y="238.5" text-anchor="middle" font-size="8.5" fill="#555">đặc trưng giá</text>
  <!-- GPU badge -->
  <rect x="368" y="194" width="28" height="16" fill="#a31f34"/>
  <text x="382" y="202" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">GPU 1</text>

  <!-- Context Embedding GPU -->
  <rect x="280" y="270" width="120" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="340" y="293.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#333">embeddings ngữ cảnh</text>
  <text x="340" y="305" text-anchor="middle" font-size="8.5" fill="#555">thời gian, vị trí,</text>
  <text x="340" y="318.5" text-anchor="middle" font-size="8.5" fill="#555">đặc trưng thiết bị</text>
  <!-- GPU badge -->
  <rect x="368" y="274" width="28" height="16" fill="#a31f34"/>
  <text x="382" y="282" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">GPU 2</text>

  <!-- ===== Memory annotation ===== -->
  <rect x="280" y="350" width="120" height="40" fill="#f9d6d5" stroke="#c44" stroke-width="1"/>
  <text x="340" y="362.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#c44">Bảng embedding</text>
  <text x="340" y="377.5" text-anchor="middle" font-size="8" fill="#c44">chiếm ưu thế bộ nhớ</text>

  <!-- ===== Gather arrows to Gather Embeddings ===== -->
  <!-- From User Embedding -->
  <path d="M 400,140 H 410 V 210 H 430" fill="none" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <!-- From Item Embedding -->
  <path d="M 400,220 H 430" fill="none" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <!-- From Context Embedding -->
  <path d="M 400,300 H 410 V 230 H 430" fill="none" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- ===== Gather Embeddings box ===== -->
  <rect x="430" y="180" width="100" height="80" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="480" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Thu thập</text>
  <text x="480" y="213" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Embeddings</text>
  <text x="480" y="225.5" text-anchor="middle" font-size="8.5" fill="#555">Nối + gộp</text>
  <text x="480" y="239" text-anchor="middle" font-size="8.5" fill="#555">vector đặc trưng</text>
  <text x="480" y="252.5" text-anchor="middle" font-size="8.5" fill="#555">AllGather op</text>

  <!-- Arrow: Gather → Dense Ranking -->
  <line x1="530" y1="220" x2="560" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Dense Ranking Network (green) ===== -->
  <rect x="560" y="180" width="100" height="80" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="610" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Xếp hạng đặc</text>
  <text x="610" y="223.5" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Mạng</text>
  <text x="610" y="238" text-anchor="middle" font-size="8.5" fill="#555">Tương tác MLP</text>
  <text x="610" y="251.5" text-anchor="middle" font-size="8.5" fill="#555">lớp (tính toán)</text>
  <!-- GPU badge -->
  <rect x="628" y="184" width="28" height="16" fill="#a31f34"/>
  <text x="642" y="195" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">GPU 3</text>

  <!-- Arrow: Dense Ranking → Response -->
  <line x1="610" y1="260" x2="610" y2="290" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ===== Response (green) ===== -->
  <rect x="560" y="290" width="100" height="50" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="610" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Phản hồi</text>
  <text x="610" y="328" text-anchor="middle" font-size="8.5" fill="#555">Mục đã xếp hạng</text>

  <!-- ===== Phase labels ===== -->
  <!-- Vertical dashed section dividers -->
  <line x1="260" y1="70" x2="260" y2="440" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>
  <line x1="420" y1="70" x2="420" y2="440" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>
  <line x1="540" y1="70" x2="540" y2="440" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- Phase header labels -->
  <text x="180" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#555">ĐẦU VÀO</text>
  <text x="340" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#4a90c4">TRA CỨU EMBEDDING</text>
  <text x="480" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#3d9e5a">THU THẬP</text>
  <text x="610" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#3d9e5a">XẾP HẠNG</text>

  <!-- ===== Parallel execution brace annotation ===== -->
  <path d="M 280,400 V 410 H 400 V 400" fill="none" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="340" y="425" text-anchor="middle" font-size="8.5" fill="#4a90c4">Thực thi song song</text>

  <!-- ===== Footer ===== -->
  <text x="340" y="460" text-anchor="middle" font-size="9" fill="#999" font-style="italic">Bảng embedding được phân mảnh trên các GPU; xếp hạng đặc chạy sau khi thu thập tất cả embeddings, khai thác song song cấp đặc trưng.</text>
</svg>