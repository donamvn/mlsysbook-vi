<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 540">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c87b2a"/>
    </marker>
  </defs>

  <rect width="680" height="540" fill="#fff"/>

  <!-- ── Title ── -->
  <text x="340" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Phân phối lưu lượng nhận biết Spot</text>

  <!-- ── Incoming request ── -->
  <rect x="275" y="44" width="130" height="40" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="340" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Yêu cầu đến</text>
  <text x="340" y="78" text-anchor="middle" font-size="8.5" fill="#555">phân loại theo tầng SLO</text>

  <!-- Arrow to load balancer -->
  <line x1="340" y1="84" x2="340" y2="126" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ── Load Balancer ── -->
  <rect x="214" y="126" width="252" height="52" fill="#fdebd0" stroke="#c87b2a" stroke-width="2"/>
  <text x="340" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#333">Bộ cân bằng tải</text>
  <text x="340" y="164" text-anchor="middle" font-size="9" fill="#555">định tuyến theo lớp SLO: theo yêu cầu vs. nỗ lực tối đa</text>

  <!-- Split arrows: 70% left, 30% right -->
  <path d="M 286 178 L 286 210 L 170 210 L 170 240" fill="none" stroke="#3d9e5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 394 178 L 394 210 L 510 210 L 510 240" fill="none" stroke="#c87b2a" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow-orange)"/>

  <!-- 70% / 30% labels -->
  <text x="228" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#3d9e5a">70%</text>
  <text x="452" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#c87b2a">30%</text>

  <!-- ══════════════════════════════════════
       ON-DEMAND COLUMN (left)
       ══════════════════════════════════════ -->
  <rect x="20" y="240" width="300" height="200" fill="#e8f5e9" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="170" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#2d7a2d">Bản sao theo yêu cầu</text>
  <text x="170" y="286" text-anchor="middle" font-size="8.5" fill="#555">dung lượng đảm bảo · luôn sẵn sàng</text>

  <!-- Replica boxes -->
  <rect x="40" y="308" width="80" height="56" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="80" y="324" text-anchor="middle" font-size="8.5" font-weight="700" fill="#333">Worker 0</text>
  <text x="80" y="338" text-anchor="middle" font-size="8" fill="#555">GPU dành riêng</text>
  <text x="80" y="352" text-anchor="middle" font-size="7.5" fill="#3d9e5a">luôn hoạt động</text>

  <rect x="130" y="308" width="80" height="56" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="170" y="324" text-anchor="middle" font-size="8.5" font-weight="700" fill="#333">Worker 1</text>
  <text x="170" y="338" text-anchor="middle" font-size="8" fill="#555">GPU dành riêng</text>
  <text x="170" y="352" text-anchor="middle" font-size="7.5" fill="#3d9e5a">luôn hoạt động</text>

  <rect x="220" y="308" width="80" height="56" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="260" y="324" text-anchor="middle" font-size="8.5" font-weight="700" fill="#333">Worker 2</text>
  <text x="260" y="338" text-anchor="middle" font-size="8" fill="#555">GPU dành riêng</text>
  <text x="260" y="352" text-anchor="middle" font-size="7.5" fill="#3d9e5a">luôn hoạt động</text>

  <!-- SLO label -->
  <rect x="60" y="386" width="220" height="34" fill="#fff" stroke="#3d9e5a" stroke-width="1.2"/>
  <text x="170" y="401" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2d7a2d">Yêu cầu quan trọng SLO</text>
  <text x="170" y="414" text-anchor="middle" font-size="8.5" fill="#555">độ trễ đảm bảo · không rủi ro thu hồi</text>

  <!-- ══════════════════════════════════════
       SPOT COLUMN (right)
       ══════════════════════════════════════ -->
  <rect x="360" y="240" width="300" height="200" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="510" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#c87b2a">Bản sao Spot</text>
  <text x="510" y="286" text-anchor="middle" font-size="8.5" fill="#555">tiết kiệm chi phí · có thể bị thu hồi</text>

  <rect x="380" y="308" width="80" height="56" fill="#f7f7f7" stroke="#c87b2a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="420" y="324" text-anchor="middle" font-size="8.5" font-weight="700" fill="#555">Worker 3</text>
  <text x="420" y="338" text-anchor="middle" font-size="8" fill="#555">GPU Spot</text>
  <text x="420" y="352" text-anchor="middle" font-size="7.5" fill="#c87b2a">có thể bị thu hồi</text>

  <rect x="470" y="308" width="80" height="56" fill="#f7f7f7" stroke="#c87b2a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="510" y="324" text-anchor="middle" font-size="8.5" font-weight="700" fill="#555">Worker 4</text>
  <text x="510" y="338" text-anchor="middle" font-size="8" fill="#555">GPU Spot</text>
  <text x="510" y="352" text-anchor="middle" font-size="7.5" fill="#c87b2a">có thể bị thu hồi</text>

  <rect x="560" y="308" width="80" height="56" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
  <text x="600" y="331" text-anchor="middle" font-size="8.5" fill="#999">bị thu hồi</text>
  <text x="600" y="345" text-anchor="middle" font-size="7.5" fill="#999">đang rút</text>

  <!-- SLO label -->
  <rect x="396" y="386" width="228" height="34" fill="#fff" stroke="#c87b2a" stroke-width="1.2"/>
  <text x="510" y="401" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c87b2a">Yêu cầu nỗ lực tối đa</text>
  <text x="510" y="414" text-anchor="middle" font-size="8.5" fill="#555">thử lại khi bị thu hồi · tiết kiệm ~60–70% chi phí</text>

  <!-- ── Cost comparison bar ── -->
  <rect x="20" y="460" width="640" height="42" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
  <text x="340" y="476" text-anchor="middle" font-size="9.5" font-weight="700" fill="#333">Cấu trúc chi phí: 70% theo yêu cầu + 30% spot ≈ giảm 18-27% so với 100% theo yêu cầu</text>
  <text x="340" y="492" text-anchor="middle" font-size="9" fill="#555">Giá Spot: giảm ~70% · tỷ lệ thu hồi: 5–15% tùy loại phiên bản và khu vực</text>

  <!-- ── Bottom footnote ── -->
  <text x="340" y="515" text-anchor="middle" font-size="9" font-style="italic" fill="#999">Worker Spot rút yêu cầu đang xử lý trước khi bị thu hồi nếu được báo trước (thường 2 phút).</text>

</svg>