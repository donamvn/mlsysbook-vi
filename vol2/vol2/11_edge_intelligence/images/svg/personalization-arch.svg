<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 732 506">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c44"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90c4"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c87b2a"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <rect width="732" height="506" fill="#fff"/>

  <!-- Panel A: Full Fine-tuning -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="204" height="428" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="0" y="0" width="204" height="30" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
    <rect x="0" y="18" width="204" height="12" fill="#f9d6d5"/>
    <text x="102" y="20" font-size="11" font-weight="700" fill="#333" text-anchor="middle">A — Tinh chỉnh (fine-tuning) toàn phần</text>

    <!-- 5 fully trainable layers + gradient arrow -->
    <rect x="30" y="46" width="126" height="24" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="80" y="62" font-size="8.5" fill="#4a90c4" text-anchor="middle">Lớp 1 (có thể huấn luyện)</text>

    <rect x="30" y="84" width="126" height="24" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="80" y="100" font-size="8.5" fill="#4a90c4" text-anchor="middle">Lớp 2 (có thể huấn luyện)</text>

    <rect x="30" y="122" width="126" height="24" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="80" y="138" font-size="8.5" fill="#4a90c4" text-anchor="middle">Lớp 3 (có thể huấn luyện)</text>

    <rect x="30" y="160" width="126" height="24" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
    <text x="80" y="176" font-size="8.5" fill="#4a90c4" text-anchor="middle">Lớp 4 (có thể huấn luyện)</text>

    <rect x="30" y="198" width="126" height="24" fill="#4a90c4" stroke="#4a90c4" stroke-width="1.5"/>
    <text x="80" y="214" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="600">Head (có thể huấn luyện)</text>

    <!-- Gradient backprop arrow -->
    <path d="M 156,210 L 176,210 L 176,58 L 156,58" fill="none" stroke="#c44" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
    <text x="184" y="134" font-size="7.5" fill="#c44" text-anchor="middle" transform="rotate(-90, 184, 134)">gradient tất cả các lớp</text>

    <!-- Connecting lines -->
    <line x1="93" y1="70" x2="93" y2="84" stroke="#4a90c4" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="93" y1="108" x2="93" y2="122" stroke="#4a90c4" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="93" y1="146" x2="93" y2="160" stroke="#4a90c4" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="93" y1="184" x2="93" y2="198" stroke="#4a90c4" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Property box -->
    <rect x="14" y="240" width="176" height="52" fill="#f9d6d5" stroke="#c44" stroke-width="0.8"/>
    <text x="102" y="256" font-size="8.5" font-weight="700" fill="#a31f34" text-anchor="middle">Bộ nhớ cao, độ chính xác cao</text>
    <text x="102" y="270" font-size="8" fill="#c44" text-anchor="middle">Lưu trữ tất cả activation trung gian</text>
    <text x="102" y="282" font-size="8" fill="#c44" text-anchor="middle">3–5× dung lượng bộ nhớ suy luận</text>

    <!-- Memory bar -->
    <rect x="14" y="304" width="22" height="90" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
    <rect x="14" y="304" width="22" height="88" fill="#f9d6d5" stroke="#c44" stroke-width="0.8"/>
    <text x="25" y="300" font-size="7.5" fill="#c44" text-anchor="middle">Mem</text>
    <text x="44" y="330" font-size="7.5" fill="#c44">cao</text>

    <!-- Param count bar -->
    <rect x="90" y="304" width="22" height="90" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
    <rect x="90" y="304" width="22" height="88" fill="#cfe2f3" stroke="#4a90c4" stroke-width="0.8"/>
    <text x="102" y="300" font-size="7.5" fill="#4a90c4" text-anchor="middle">Params</text>
    <text x="116" y="330" font-size="7.5" fill="#4a90c4">tất cả</text>

    <text x="102" y="410" font-size="8" fill="#999" text-anchor="middle">Phù hợp khi:</text>
    <text x="102" y="424" font-size="8" fill="#999" text-anchor="middle">bộ nhớ lớn + dữ liệu có sẵn</text>
  </g>

  <!-- Panel B: Head-Only Adaptation -->
  <g transform="translate(264, 20)">
    <rect x="0" y="0" width="204" height="428" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="0" y="0" width="204" height="30" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
    <rect x="0" y="18" width="204" height="12" fill="#d4edda"/>
    <text x="102" y="20" font-size="11" font-weight="700" fill="#333" text-anchor="middle">B — Thích nghi chỉ Head</text>

    <!-- Frozen backbone layers (gray) -->
    <rect x="30" y="46" width="126" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="80" y="62" font-size="8.5" fill="#999" text-anchor="middle">Lớp 1 (đóng băng)</text>

    <rect x="30" y="84" width="126" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="80" y="100" font-size="8.5" fill="#999" text-anchor="middle">Lớp 2 (đóng băng)</text>

    <rect x="30" y="122" width="126" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="80" y="138" font-size="8.5" fill="#999" text-anchor="middle">Lớp 3 (đóng băng)</text>

    <rect x="30" y="160" width="126" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="80" y="176" font-size="8.5" fill="#999" text-anchor="middle">Lớp 4 (đóng băng)</text>

    <!-- Trainable head only -->
    <rect x="30" y="198" width="126" height="24" fill="#3d9e5a" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="80" y="214" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="600">Head (có thể huấn luyện)</text>

    <!-- Only head gradient -->
    <path d="M 156,210 L 172,210 L 172,191 L 140,191 L 140,198" fill="none" stroke="#3d9e5a" stroke-width="1.3" marker-end="url(#arr-green)"/>
    <text x="176" y="208" font-size="7.5" fill="#3d9e5a">grad</text>

    <!-- Freeze symbol on backbone -->
    <text x="158" y="130" font-size="12" fill="#bbb" text-anchor="middle">❄</text>

    <!-- Connecting lines -->
    <line x1="93" y1="70" x2="93" y2="84" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="93" y1="108" x2="93" y2="122" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="93" y1="146" x2="93" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="93" y1="184" x2="93" y2="198" stroke="#3d9e5a" stroke-width="1"/>

    <!-- Property box -->
    <rect x="14" y="240" width="176" height="52" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.8"/>
    <text x="102" y="256" font-size="8.5" font-weight="700" fill="#3d9e5a" text-anchor="middle">Bộ nhớ thấp, thích nghi nhanh</text>
    <text x="102" y="270" font-size="8" fill="#3d9e5a" text-anchor="middle">Không lưu activation cho backbone</text>
    <text x="102" y="282" font-size="8" fill="#3d9e5a" text-anchor="middle">Chỉ huấn luyện tham số Head</text>

    <!-- Memory bar -->
    <rect x="14" y="304" width="22" height="90" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
    <rect x="14" y="364" width="22" height="30" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.8"/>
    <text x="25" y="300" font-size="7.5" fill="#3d9e5a" text-anchor="middle">Mem</text>
    <text x="44" y="368" font-size="7.5" fill="#3d9e5a">thấp</text>

    <!-- Param bar -->
    <rect x="90" y="304" width="22" height="90" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
    <rect x="90" y="376" width="22" height="18" fill="#d4edda" stroke="#3d9e5a" stroke-width="0.8"/>
    <text x="102" y="300" font-size="7.5" fill="#3d9e5a" text-anchor="middle">Params</text>
    <text x="116" y="376" font-size="7.5" fill="#3d9e5a">ít</text>

    <text x="102" y="410" font-size="8" fill="#999" text-anchor="middle">Phù hợp khi:</text>
    <text x="102" y="424" font-size="8" fill="#999" text-anchor="middle">bộ nhớ hạn chế, cùng miền</text>
  </g>

  <!-- Panel C: Adapter / LoRA -->
  <g transform="translate(508, 20)">
    <rect x="0" y="0" width="204" height="428" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="0" y="0" width="204" height="30" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.2"/>
    <rect x="0" y="18" width="204" height="12" fill="#fdebd0"/>
    <text x="102" y="20" font-size="11" font-weight="700" fill="#333" text-anchor="middle">C — Adapter / LoRA</text>

    <!-- Frozen backbone with adapter modules -->
    <!-- Layer 1 + adapter -->
    <rect x="30" y="46" width="100" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="93" y="62" font-size="8" fill="#999" text-anchor="middle">Lớp 1 (đóng băng)</text>
    <rect x="138" y="48" width="40" height="20" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
    <text x="158" y="61" font-size="7.5" fill="#c87b2a" text-anchor="middle" font-weight="600">Adapter</text>
    <line x1="130" y1="58" x2="138" y2="58" stroke="#c87b2a" stroke-width="1"/>

    <!-- Layer 2 + adapter -->
    <rect x="30" y="84" width="100" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="93" y="100" font-size="8" fill="#999" text-anchor="middle">Lớp 2 (đóng băng)</text>
    <rect x="138" y="86" width="40" height="20" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
    <text x="158" y="99" font-size="7.5" fill="#c87b2a" text-anchor="middle" font-weight="600">Adapter</text>
    <line x1="130" y1="96" x2="138" y2="96" stroke="#c87b2a" stroke-width="1"/>

    <!-- Layer 3 + adapter -->
    <rect x="30" y="122" width="100" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="93" y="138" font-size="8" fill="#999" text-anchor="middle">Lớp 3 (đóng băng)</text>
    <rect x="138" y="124" width="40" height="20" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
    <text x="158" y="137" font-size="7.5" fill="#c87b2a" text-anchor="middle" font-weight="600">LoRA</text>
    <line x1="130" y1="134" x2="138" y2="134" stroke="#c87b2a" stroke-width="1"/>

    <!-- Layer 4 + adapter -->
    <rect x="30" y="160" width="100" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1.2"/>
    <text x="93" y="176" font-size="8" fill="#999" text-anchor="middle">Lớp 4 (đóng băng)</text>
    <rect x="138" y="162" width="40" height="20" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
    <text x="158" y="175" font-size="7.5" fill="#c87b2a" text-anchor="middle" font-weight="600">LoRA</text>
    <line x1="130" y1="172" x2="138" y2="172" stroke="#c87b2a" stroke-width="1"/>

    <!-- Head -->
    <rect x="30" y="198" width="100" height="24" fill="#c87b2a" stroke="#c87b2a" stroke-width="1.5"/>
    <text x="93" y="214" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="600">Head (có thể huấn luyện)</text>

    <!-- Freeze icon -->
    <text x="18" y="138" font-size="12" fill="#bbb" text-anchor="middle">❄</text>

    <!-- Connecting lines backbone -->
    <line x1="80" y1="70" x2="80" y2="84" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="80" y1="108" x2="80" y2="122" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="80" y1="146" x2="80" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="80" y1="184" x2="80" y2="198" stroke="#c87b2a" stroke-width="1"/>

    <!-- Adapter residual connections -->
    <path d="M 158,68 L 158,74 L 186,74 L 186,96 L 178,96" fill="none" stroke="#c87b2a" stroke-width="0.8" stroke-dasharray="2,1"/>
    <path d="M 158,106 L 158,112 L 186,112 L 186,134 L 178,134" fill="none" stroke="#c87b2a" stroke-width="0.8" stroke-dasharray="2,1"/>
    <path d="M 158,144 L 158,150 L 186,150 L 186,172 L 178,172" fill="none" stroke="#c87b2a" stroke-width="0.8" stroke-dasharray="2,1"/>

    <!-- Property box -->
    <rect x="14" y="240" width="176" height="52" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.8"/>
    <text x="102" y="256" font-size="8.5" font-weight="700" fill="#c87b2a" text-anchor="middle">Tham số tối thiểu, có thể kết hợp</text>
    <text x="102" y="270" font-size="8" fill="#c87b2a" text-anchor="middle">r ≪ d: phân rã hạng thấp</text>
    <text x="102" y="282" font-size="8" fill="#c87b2a" text-anchor="middle">&lt;1% tham số backbone được huấn luyện</text>

    <!-- Memory bar -->
    <rect x="14" y="304" width="22" height="90" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
    <rect x="14" y="380" width="22" height="14" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.8"/>
    <text x="25" y="300" font-size="7.5" fill="#c87b2a" text-anchor="middle">Mem</text>
    <text x="44" y="384" font-size="7.5" fill="#c87b2a">rất nhỏ</text>

    <!-- Param bar -->
    <rect x="90" y="304" width="22" height="90" fill="#e8e8e8" stroke="#bbb" stroke-width="0.8"/>
    <rect x="90" y="384" width="22" height="10" fill="#fdebd0" stroke="#c87b2a" stroke-width="0.8"/>
    <text x="102" y="300" font-size="7.5" fill="#c87b2a" text-anchor="middle">Params</text>
    <text x="116" y="384" font-size="7.5" fill="#c87b2a">1%</text>

    <text x="102" y="410" font-size="8" fill="#999" text-anchor="middle">Phù hợp khi:</text>
    <text x="102" y="424" font-size="8" fill="#999" text-anchor="middle">ràng buộc bộ nhớ cực đoan</text>
  </g>

  <text x="366" y="470" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Chiến lược cá nhân hóa đánh đổi khả năng biểu đạt lấy hiệu quả bộ nhớ;</text>
  <text x="366" y="482" font-size="9" fill="#999" text-anchor="middle" font-style="italic">adapter đạt độ chính xác gần như tối đa với chi phí 1% tham số.</text>
</svg>