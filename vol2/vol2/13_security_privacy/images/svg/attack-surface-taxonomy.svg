  <rect x="46" y="354" width="616" height="52" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <rect x="52" y="361" width="130" height="38" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="117" y="377" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Lớp Hạ tầng</text>
  <text x="117" y="391" font-size="8.5" fill="#555" text-anchor="middle">Tính toán, mạng, điều phối</text>

  <rect x="194" y="361" width="140" height="38" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="264" y="375" font-size="9" font-weight="700" fill="#333" text-anchor="middle">Tài sản</text>
  <text x="264" y="388" font-size="8.5" fill="#555" text-anchor="middle">Bộ tăng tốc · Container · Khóa</text>

  <line x1="342" y1="364" x2="342" y2="397" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <rect x="350" y="361" width="300" height="38" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="500" y="375" font-size="9" font-weight="700" fill="#a31f34" text-anchor="middle">Mối đe dọa</text>
  <text x="500" y="388" font-size="8.5" fill="#555" text-anchor="middle">Kênh phụ · Chèn lỗi · Thoát khỏi tenant</text>

  <!-- Connector arrow -->
  <line x1="340" y1="406" x2="340" y2="426" stroke="#a31f34" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>

  <!-- ===== Layer 1: Supply Chain Layer (bottom — deepest) ===== -->
  <rect x="46" y="426" width="616" height="52" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <!-- Layer label pill -->
  <rect x="52" y="433" width="130" height="38" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="117" y="449" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Lớp Chuỗi cung ứng</text>
  <text x="117" y="463" font-size="8.5" fill="#555" text-anchor="middle">framework, phần cứng, trọng số</text>

  <!-- Assets -->
  <rect x="194" y="433" width="140" height="38" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="264" y="447" font-size="9" font-weight="700" fill="#333" text-anchor="middle">Tài sản</text>
  <text x="264" y="460" font-size="8.5" fill="#555" text-anchor="middle">Gói framework · Firmware · Trọng số</text>

  <!-- Separator -->
  <line x1="342" y1="436" x2="342" y2="469" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- Threats -->
  <rect x="350" y="433" width="300" height="38" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="500" y="447" font-size="9" font-weight="700" fill="#a31f34" text-anchor="middle">Mối đe dọa</text>
  <text x="500" y="460" font-size="8.5" fill="#555" text-anchor="middle">Trọng số có cửa hậu · Gói bị đầu độc · Firmware bị giả mạo</text>

  <!-- ===== Legend ===== -->
  <rect x="46" y="495" width="14" height="10" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/>
  <text x="65" y="504" font-size="8.5" fill="#555">Tài sản (xanh)</text>
  <rect x="140" y="495" width="14" height="10" fill="#f9d6d5" stroke="#c44" stroke-width="1"/>
  <text x="159" y="504" font-size="8.5" fill="#555">Mối đe dọa (đỏ)</text>
  <rect x="234" y="495" width="14" height="10" fill="#d4edda" stroke="#3d9e5a" stroke-width="1"/>
  <text x="253" y="504" font-size="8.5" fill="#555">Phòng thủ (xanh lá)</text>

  <!-- Bottom footnote -->
  <text x="340" y="504" font-size="9" fill="#999" text-anchor="middle" font-style="italic"/>
