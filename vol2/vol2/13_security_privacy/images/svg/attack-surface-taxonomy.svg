  <text x="421.5" y="167" font-size="8.5" fill="#555" text-anchor="middle">Phát hiện bất thường thống kê · Giám sát chất lượng dữ liệu</text>

  <line x1="340" y1="189" x2="340" y2="209" stroke="#a31f34" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>

