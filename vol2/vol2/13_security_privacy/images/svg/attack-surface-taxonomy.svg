  <rect x="46" y="209" width="616" height="125" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <rect x="52" y="219" width="130" height="38" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
