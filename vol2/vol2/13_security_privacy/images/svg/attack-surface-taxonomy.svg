  <text x="264" y="233" font-size="9" font-weight="700" fill="#333" text-anchor="middle">Tài sản</text>
  <text x="264" y="246" font-size="8.5" fill="#555" text-anchor="middle">Trọng số · Gradient · checkpoint</text>

  <line x1="342" y1="222" x2="342" y2="255" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- Threats box -->
  <rect x="350" y="219" width="300" height="38" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="500" y="233" font-size="9" font-weight="700" fill="#a31f34" text-anchor="middle">Mối đe dọa</text>
  <text x="500" y="246" font-size="8.5" fill="#555" text-anchor="middle">Chèn cửa hậu · Đánh cắp trọng số · Mô hình Trojan</text>

  <!-- Defenses row within Model Layer -->
  <rect x="194" y="267" width="455" height="58" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.2"/>
  <text x="421.5" y="282" font-size="9" font-weight="700" fill="#333" text-anchor="middle">Phòng thủ</text>
  <text x="421.5" y="297" font-size="8.5" fill="#555" text-anchor="middle">Môi trường huấn luyện an toàn · Lưu trữ mô hình mã hóa · Kiểm soát truy cập</text>
  <text x="421.5" y="312" font-size="8.5" fill="#555" text-anchor="middle">Phân tích hành vi mô hình · Giám sát phân bố trọng số</text>

  <line x1="340" y1="334" x2="340" y2="354" stroke="#a31f34" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>

