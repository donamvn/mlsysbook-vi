<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 530">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
  </defs>

  <rect width="680" height="530" fill="#fff"/>

  <!-- ===== Title ===== -->
  <text x="340" y="28" font-size="13" font-weight="700" fill="#333" text-anchor="middle">Phân loại Bề mặt Tấn công ML</text>
  <text x="340" y="44" font-size="9" fill="#555" text-anchor="middle">Bốn lớp liên kết, mỗi lớp có tài sản và vector đe dọa riêng</text>

  <!-- ===== Depth axis label ===== -->
  <!-- Left sidebar: Increasing Access Depth -->
  <line x1="28" y1="68" x2="28" y2="460" stroke="#a31f34" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="18" y="264" font-size="9" font-weight="700" fill="#a31f34" text-anchor="middle" transform="rotate(-90 18 264)">Tăng Độ sâu Truy cập</text>

  <!-- ===== Layer 4: Data Layer (top) ===== -->
  <rect x="46" y="64" width="616" height="125" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <rect x="52" y="74" width="130" height="38" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="117" y="90" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Lớp Dữ liệu</text>
  <text x="117" y="104" font-size="8.5" fill="#555" text-anchor="middle">Tập huấn luyện, pipelines, nhãn</text>

  <!-- Assets -->
  <rect x="194" y="74" width="140" height="38" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="264" y="88" font-size="9" font-weight="700" fill="#333" text-anchor="middle">Tài sản</text>
  <text x="264" y="101" font-size="8.5" fill="#555" text-anchor="middle">Tập dữ liệu · Nhãn · embedding</text>

  <line x1="342" y1="77" x2="342" y2="110" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- Threats -->
  <rect x="350" y="74" width="300" height="38" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <text x="500" y="88" font-size="9" font-weight="700" fill="#a31f34" text-anchor="middle">Mối đe dọa</text>
  <text x="500" y="101" font-size="8.5" fill="#555" text-anchor="middle">Đầu độc · Thao túng nhãn · Suy luận thành viên</text>

