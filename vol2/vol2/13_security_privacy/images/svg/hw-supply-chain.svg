<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460">
  <defs>
    <marker id="arr-fwd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90c4"/>
    </marker>
    <marker id="arr-threat-dn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fff"/>

  <!-- Stage positions: x centers at 68, 186, 304, 422, 540 (width 96, gap 28) -->

  <!-- Stage 1: Design -->
  <rect x="20" y="140" width="96" height="80" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="68" y="175" font-size="11" font-weight="700" fill="#4a90c4" text-anchor="middle">Thiết kế</text>
  <text x="68" y="191" font-size="8.5" fill="#555" text-anchor="middle">Kiến trúc,</text>
  <text x="68" y="203" font-size="8.5" fill="#555" text-anchor="middle">IP, sơ đồ</text>

  <!-- Arrow 1→2 -->
  <line x1="116" y1="180" x2="138" y2="180" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-fwd)"/>

  <!-- Stage 2: Fabrication -->
  <rect x="138" y="140" width="96" height="80" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="186" y="175" font-size="11" font-weight="700" fill="#4a90c4" text-anchor="middle">Chế tạo</text>
  <text x="186" y="191" font-size="8.5" fill="#555" text-anchor="middle">Sản xuất wafer,</text>
  <text x="186" y="203" font-size="8.5" fill="#555" text-anchor="middle">nhà máy bán dẫn</text>

  <!-- Arrow 2→3 -->
  <line x1="234" y1="180" x2="256" y2="180" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-fwd)"/>

  <!-- Stage 3: Assembly -->
  <rect x="256" y="140" width="96" height="80" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="304" y="175" font-size="11" font-weight="700" fill="#4a90c4" text-anchor="middle">Lắp ráp</text>
  <text x="304" y="191" font-size="8.5" fill="#555" text-anchor="middle">PCB, đóng gói,</text>
  <text x="304" y="203" font-size="8.5" fill="#555" text-anchor="middle">tìm nguồn linh kiện</text>

  <!-- Arrow 3→4 -->
  <line x1="352" y1="180" x2="374" y2="180" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-fwd)"/>

  <!-- Stage 4: Distribution -->
  <rect x="374" y="140" width="96" height="80" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="422" y="175" font-size="11" font-weight="700" fill="#4a90c4" text-anchor="middle">Phân phối</text>
  <text x="422" y="191" font-size="8.5" fill="#555" text-anchor="middle">Vận chuyển, đại lý,</text>
  <text x="422" y="203" font-size="8.5" fill="#555" text-anchor="middle">chuỗi logistics</text>

  <!-- Arrow 4→5 -->
  <line x1="470" y1="180" x2="492" y2="180" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-fwd)"/>

  <!-- Stage 5: Deployment -->
  <rect x="492" y="140" width="96" height="80" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="540" y="175" font-size="11" font-weight="700" fill="#4a90c4" text-anchor="middle">Triển khai</text>
  <text x="540" y="191" font-size="8.5" fill="#555" text-anchor="middle">Giá đỡ trung tâm dữ liệu,</text>
  <text x="540" y="203" font-size="8.5" fill="#555" text-anchor="middle">cấp phát đám mây</text>

  <!-- Attack vector boxes below each stage -->
  <!-- Design: IP Theft -->
  <line x1="68" y1="220" x2="68" y2="272" stroke="#a31f34" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-threat-dn)"/>
  <rect x="20" y="272" width="96" height="50" fill="#f9d6d5" stroke="#c44" stroke-width="1.3"/>
  <text x="68" y="293" font-size="9.5" font-weight="700" fill="#a31f34" text-anchor="middle">Trộm cắp IP</text>
  <text x="68" y="307" font-size="8" fill="#555" text-anchor="middle">Đánh cắp tệp thiết kế,</text>
  <text x="68" y="318" font-size="8" fill="#555" text-anchor="middle">ngược kỹ thuật kiến trúc.</text>

  <!-- Fabrication: Hardware Trojan -->
  <line x1="186" y1="220" x2="186" y2="272" stroke="#a31f34" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-threat-dn)"/>
  <rect x="138" y="272" width="96" height="50" fill="#f9d6d5" stroke="#c44" stroke-width="1.3"/>
  <text x="186" y="293" font-size="9.5" font-weight="700" fill="#a31f34" text-anchor="middle">Trojan phần cứng</text>
  <text x="186" y="307" font-size="8" fill="#555" text-anchor="middle">Mạch độc hại</text>
  <text x="186" y="318" font-size="8" fill="#555" text-anchor="middle">chèn lúc chế tạo</text>

  <!-- Assembly: Counterfeit Parts -->
  <line x1="304" y1="220" x2="304" y2="272" stroke="#a31f34" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-threat-dn)"/>
  <rect x="256" y="272" width="96" height="50" fill="#f9d6d5" stroke="#c44" stroke-width="1.3"/>
  <text x="304" y="293" font-size="9.5" font-weight="700" fill="#a31f34" text-anchor="middle">Linh kiện giả</text>
  <text x="304" y="307" font-size="8" fill="#555" text-anchor="middle">Chip kém chất lượng,</text>
  <text x="304" y="318" font-size="8" fill="#555" text-anchor="middle">linh kiện nhân bản</text>

  <!-- Distribution: Interdiction -->
  <line x1="422" y1="220" x2="422" y2="272" stroke="#a31f34" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-threat-dn)"/>
  <rect x="374" y="272" width="96" height="50" fill="#f9d6d5" stroke="#c44" stroke-width="1.3"/>
  <text x="422" y="293" font-size="9.5" font-weight="700" fill="#a31f34" text-anchor="middle">Ngăn chặn</text>
  <text x="422" y="307" font-size="8" fill="#555" text-anchor="middle">Can thiệp phần cứng</text>
  <text x="422" y="318" font-size="8" fill="#555" text-anchor="middle">đang vận chuyển (quốc gia)</text>

  <!-- Deployment: Firmware Attack -->
  <line x1="540" y1="220" x2="540" y2="272" stroke="#a31f34" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-threat-dn)"/>
  <rect x="492" y="272" width="96" height="50" fill="#f9d6d5" stroke="#c44" stroke-width="1.3"/>
  <text x="540" y="293" font-size="9.5" font-weight="700" fill="#a31f34" text-anchor="middle">Tấn công Firmware</text>
  <text x="540" y="307" font-size="8" fill="#555" text-anchor="middle">BIOS/BMC độc hại,</text>
  <text x="540" y="318" font-size="8" fill="#555" text-anchor="middle">rootkit dai dẳng</text>

  <!-- Trust level indicators (top) -->
  <text x="68" y="114" font-size="8.5" fill="#3d9e5a" font-weight="600" text-anchor="middle">Đáng tin cậy</text>
  <text x="186" y="114" font-size="8.5" fill="#c87b2a" font-weight="600" text-anchor="middle">Tin cậy một phần</text>
  <text x="304" y="114" font-size="8.5" fill="#c87b2a" font-weight="600" text-anchor="middle">Ít tin cậy</text>
  <text x="422" y="114" font-size="8.5" fill="#a31f34" font-weight="600" text-anchor="middle">Không đáng tin</text>
  <text x="540" y="114" font-size="8.5" fill="#3d9e5a" font-weight="600" text-anchor="middle">Đã xác minh lại</text>
  <text x="68" y="126" font-size="7.5" fill="#999" text-anchor="middle">(tổ chức thiết kế)</text>
  <text x="186" y="126" font-size="7.5" fill="#999" text-anchor="middle">(nhà máy bên thứ 3)</text>
  <text x="304" y="126" font-size="7.5" fill="#999" text-anchor="middle">(OEM, hợp đồng phụ)</text>
  <text x="422" y="126" font-size="7.5" fill="#999" text-anchor="middle">(logistics mở)</text>
  <text x="540" y="126" font-size="7.5" fill="#999" text-anchor="middle">(tại đích)</text>

  <!-- Legend -->
  <rect x="30" y="354" width="12" height="12" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1"/>
  <text x="48" y="365" font-size="9" fill="#555">Giai đoạn chuỗi cung ứng</text>
  <rect x="175" y="354" width="12" height="12" fill="#f9d6d5" stroke="#c44" stroke-width="1"/>
  <text x="193" y="365" font-size="9" fill="#555">Vector tấn công</text>
  <line x1="280" y1="360" x2="280" y2="372" stroke="#a31f34" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="288" y="365" font-size="9" fill="#555">Điểm vào tấn công</text>

  <!-- Bottom annotation -->
  <text x="340" y="415" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Không thể giả định độ tin cậy phần cứng; xác minh phải diễn ra ở mỗi ranh giới giai đoạn, với chứng thực được chuyển tiếp đến triển khai.</text>
</svg>