<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460">
  <defs>
    <marker id="arr-mt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90c4"/>
    </marker>
    <marker id="arr-red-mt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c44"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fff"/>

  <!-- Column headers -->
  <rect x="20" y="20" width="290" height="40" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
  <text x="165" y="45" font-size="12" font-weight="700" fill="#c44" text-anchor="middle">Trộm Tạo phẩm Chính xác</text>

  <rect x="370" y="20" width="290" height="40" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
  <text x="515" y="45" font-size="12" font-weight="700" fill="#c44" text-anchor="middle">Trộm Hành vi Gần đúng</text>

  <!-- Center label: access mode differs -->
  <rect x="250" y="220" width="180" height="40" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
  <text x="340" y="239" font-size="9" font-weight="700" fill="#333" text-anchor="middle">Đường truy cập khác</text>
  <text x="340" y="252" font-size="8.5" fill="#555" text-anchor="middle">Cùng rủi ro kinh doanh</text>

  <!-- === LEFT WORKFLOW: Exact Artifact Theft === -->

  <!-- Step 1L: Access model artifact -->
  <rect x="30" y="80" width="270" height="50" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <!-- Attacker icon -->
  <circle cx="58" cy="105" r="10" fill="#c44" opacity="0.25"/>
  <text x="57" y="109" font-size="10" fill="#c44" text-anchor="middle">👤</text>
  <text x="165" y="101" font-size="10" font-weight="700" fill="#c44" text-anchor="middle">Truy cập tạo phẩm mô hình</text>
  <text x="165" y="117" font-size="8.5" fill="#555" text-anchor="middle">Checkpoint, kho lưu trữ, ảnh thiết bị, hoặc tệp</text>

  <line x1="165" y1="130" x2="165" y2="150" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-mt)"/>

  <!-- Step 2L: Extract internal properties -->
  <rect x="30" y="150" width="270" height="50" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="165" y="171" font-size="10" font-weight="700" fill="#4a90c4" text-anchor="middle">Trích xuất thuộc tính nội bộ</text>
  <!-- Dataset icon: small table representation -->
  <rect x="38" y="163" width="32" height="20" fill="#fff" stroke="#4a90c4" stroke-width="0.8"/>
  <line x1="38" y1="170" x2="70" y2="170" stroke="#4a90c4" stroke-width="0.5"/>
  <line x1="50" y1="163" x2="50" y2="183" stroke="#4a90c4" stroke-width="0.5"/>
  <text x="165" y="187" font-size="8.5" fill="#555" text-anchor="middle">Trọng số, kiến trúc, siêu tham số</text>

  <line x1="165" y1="200" x2="165" y2="280" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-mt)"/>

  <!-- Step 3L: Reconstruct original model -->
  <rect x="30" y="280" width="270" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="165" y="298" font-size="10" font-weight="700" fill="#4a90c4" text-anchor="middle">Tái tạo mô hình gốc</text>
  <!-- Model icon: layered rectangles -->
  <rect x="38" y="305" width="34" height="4" fill="#4a90c4" opacity="0.8"/>
  <rect x="40" y="313" width="30" height="4" fill="#4a90c4" opacity="0.6"/>
  <rect x="42" y="321" width="26" height="4" fill="#4a90c4" opacity="0.4"/>
  <text x="165" y="317" font-size="8.5" fill="#555" text-anchor="middle">Tải tham số và cấu trúc đã phục hồi</text>
  <text x="165" y="331" font-size="8.5" fill="#555" text-anchor="middle">Không cần huấn luyện lại hay thăm dò API</text>

  <line x1="165" y1="340" x2="165" y2="360" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-mt)"/>

  <!-- Step 4L: Exact copy -->
  <rect x="30" y="360" width="270" height="60" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="165" y="383" font-size="10" font-weight="700" fill="#3d9e5a" text-anchor="middle">Bản sao mô hình chính xác</text>
  <text x="165" y="399" font-size="8.5" fill="#555" text-anchor="middle">Sử dụng hoặc bán lại IP độc quyền</text>
  <text x="165" y="412" font-size="8.5" fill="#555" text-anchor="middle">Vượt qua đầu tư huấn luyện gốc</text>

  <!-- === RIGHT WORKFLOW: Approximate Behavioral Theft === -->

  <!-- Step 1R: Queries API -->
  <rect x="380" y="80" width="270" height="50" fill="#f9d6d5" stroke="#c44" stroke-width="1.2"/>
  <circle cx="408" cy="105" r="10" fill="#c44" opacity="0.25"/>
  <text x="407" y="109" font-size="10" fill="#c44" text-anchor="middle">👤</text>
  <text x="515" y="101" font-size="10" font-weight="700" fill="#c44" text-anchor="middle">Truy vấn API đã triển khai</text>
  <text x="515" y="117" font-size="8.5" fill="#555" text-anchor="middle">Đầu vào hộp đen có mục tiêu/hệ thống</text>

  <line x1="515" y1="130" x2="515" y2="150" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-mt)"/>

  <!-- Step 2R: Observe outputs -->
  <rect x="380" y="150" width="270" height="50" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="515" y="171" font-size="10" font-weight="700" fill="#4a90c4" text-anchor="middle">Quan sát tín hiệu đầu ra</text>
  <text x="515" y="187" font-size="8.5" fill="#555" text-anchor="middle">Nhãn, logits, embedding, điểm tin cậy</text>

  <line x1="515" y1="200" x2="515" y2="280" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-mt)"/>

  <!-- Step 3R: Train surrogate -->
  <rect x="380" y="280" width="270" height="60" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.2"/>
  <text x="515" y="298" font-size="10" font-weight="700" fill="#4a90c4" text-anchor="middle">Huấn luyện mô hình thay thế</text>
  <!-- Smaller model icon -->
  <rect x="388" y="309" width="28" height="4" fill="#4a90c4" opacity="0.8"/>
  <rect x="390" y="317" width="24" height="4" fill="#4a90c4" opacity="0.5"/>
  <text x="515" y="317" font-size="8.5" fill="#555" text-anchor="middle">Khớp hành vi từ cặp đầu vào-đầu ra</text>
  <text x="515" y="331" font-size="8.5" fill="#555" text-anchor="middle">hoặc chắt lọc đầu ra nhãn mềm</text>

  <line x1="515" y1="340" x2="515" y2="360" stroke="#4a90c4" stroke-width="1.5" marker-end="url(#arr-mt)"/>

  <!-- Step 4R: Functional clone (lower fidelity) -->
  <rect x="380" y="360" width="270" height="60" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="515" y="383" font-size="10" font-weight="700" fill="#3d9e5a" text-anchor="middle">Bản sao chức năng</text>
  <text x="515" y="399" font-size="8.5" fill="#555" text-anchor="middle">Hành vi tác vụ gần đúng; độ trung thực</text>
  <text x="515" y="412" font-size="8.5" fill="#555" text-anchor="middle">phụ thuộc ngân sách truy vấn và độ phong phú đầu ra</text>

  <!-- Bottom annotation -->
  <text x="340" y="435" font-size="9" fill="#555" text-anchor="middle" font-style="italic">Trộm chính xác là lỗi bảo mật tạo phẩm; trộm gần đúng là lỗi bảo mật giao diện.</text>
  <text x="340" y="448" font-size="9" fill="#555" text-anchor="middle" font-style="italic">Phòng thủ kết hợp ký, mã hóa, kiểm soát truy cập, giới hạn tốc độ, giới hạn đầu ra, kiểm toán.</text>
</svg>