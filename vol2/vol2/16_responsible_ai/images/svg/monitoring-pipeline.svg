<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 680 460">
  <rect width="680" height="460" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a31f34"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d9e5a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90c4"/>
    </marker>
  </defs>

  <!-- ===== Title ===== -->
  <text x="340" y="32" font-size="13" font-weight="700" fill="#333" text-anchor="middle">pipeline Giám sát Công bằng</text>

  <!-- ===== Stage labels (top) ===== -->
  <text x="68" y="58" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Thu thập</text>
  <text x="214" y="58" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Đo lường</text>
  <text x="360" y="58" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Đánh giá</text>
  <text x="490" y="58" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Phản hồi</text>
  <text x="610" y="58" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Cải thiện</text>

  <!-- ===== Box 1: Model Predictions ===== -->
  <rect x="20" y="68" width="96" height="90" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="68" y="88" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Mô hình</text>
  <text x="68" y="101" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Dự đoán</text>
  <line x1="30" y1="108" x2="106" y2="108" stroke="#4a90c4" stroke-width="0.8"/>
  <text x="68" y="122" font-size="8.5" fill="#555" text-anchor="middle">Đầu ra suy luận</text>
  <text x="68" y="134" font-size="8.5" fill="#555" text-anchor="middle">mỗi yêu cầu</text>
  <text x="68" y="146" font-size="8.5" fill="#555" text-anchor="middle">kèm metadata</text>

  <!-- Arrow 1→2 -->
  <line x1="118" y1="113" x2="163" y2="113" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Box 2: Subgroup Metrics ===== -->
  <rect x="166" y="68" width="96" height="90" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="214" y="88" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Nhóm con</text>
  <text x="214" y="101" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Chỉ số</text>
  <line x1="176" y1="108" x2="252" y2="108" stroke="#3d9e5a" stroke-width="0.8"/>
  <text x="214" y="122" font-size="8.5" fill="#555" text-anchor="middle">FPR / TPR</text>
  <text x="214" y="134" font-size="8.5" fill="#555" text-anchor="middle">theo nhân khẩu học</text>
  <text x="214" y="146" font-size="8.5" fill="#555" text-anchor="middle">nhóm G</text>

  <!-- Arrow 2→3 -->
  <line x1="264" y1="113" x2="308" y2="113" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Box 3: Threshold Check (diamond shape) ===== -->
  <!-- Diamond centered at (360, 113) -->
  <polygon points="360,70 412,113 360,156 308,113" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="360" y="107" font-size="9.5" font-weight="700" fill="#333" text-anchor="middle">Ngưỡng</text>
  <text x="360" y="120" font-size="9.5" font-weight="700" fill="#333" text-anchor="middle">Kiểm tra</text>

  <!-- Labels on diamond branches -->
  <text x="372.0" y="172" font-size="8.5" fill="#c87b2a" text-anchor="middle" font-style="italic">gap &gt; ε ?</text>

  <!-- Arrow 3→4 (Alert, fail branch - right) -->
  <line x1="412" y1="113" x2="452" y2="113" stroke="#a31f34" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <text x="432" y="105" font-size="8" fill="#a31f34" text-anchor="middle">CÓ</text>

  <!-- Arrow 3→OK (pass branch - down) -->
  <line x1="360" y1="156" x2="360" y2="196" stroke="#3d9e5a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="376" y="180" font-size="8" fill="#3d9e5a" text-anchor="start">KHÔNG</text>

  <!-- ===== OK box (pass) ===== -->
  <rect x="308" y="198" width="104" height="44" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="360" y="215" font-size="10" font-weight="700" fill="#3d9e5a" text-anchor="middle">OK</text>
  <text x="360" y="232" font-size="8.5" fill="#555" text-anchor="middle">Tiếp tục phục vụ</text>

  <!-- ===== Box 4: Alert ===== -->
  <rect x="455" y="68" width="96" height="90" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
  <!-- Alert icon (exclamation triangle) -->
  <polygon points="503,80 518,108 488,108" fill="none" stroke="#a31f34" stroke-width="1.5"/>
  <text x="503" y="104" font-size="8" font-weight="700" fill="#a31f34" text-anchor="middle">!</text>
  <text x="503" y="122" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Cảnh báo</text>
  <line x1="465" y1="129" x2="541" y2="129" stroke="#c44" stroke-width="0.8"/>
  <text x="503" y="143" font-size="8.5" fill="#555" text-anchor="middle">Vi phạm công bằng</text>
  <text x="503" y="153" font-size="8.5" fill="#555" text-anchor="middle">đã phát hiện</text>

  <!-- Arrow 4→5 -->
  <line x1="553" y1="113" x2="573" y2="113" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== Box 5: Retrain ===== -->
  <rect x="576" y="68" width="96" height="90" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
  <text x="624" y="88" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Huấn luyện lại</text>
  <text x="624" y="101" font-size="10" font-weight="700" fill="#333" text-anchor="middle">/ Hiệu chỉnh lại</text>
  <line x1="586" y1="108" x2="662" y2="108" stroke="#4a90c4" stroke-width="0.8"/>
  <text x="624" y="122" font-size="8.5" fill="#555" text-anchor="middle">Nhận biết độ chệch</text>
  <text x="624" y="134" font-size="8.5" fill="#555" text-anchor="middle">huấn luyện lại hoặc</text>
  <text x="624" y="146" font-size="8.5" fill="#555" text-anchor="middle">dịch chuyển ngưỡng</text>

  <!-- ===== Feedback loop: Retrain → Model Predictions ===== -->
  <path d="M 624,158 Q 624,270 68,270 Q 68,168 68,158" fill="none" stroke="#4a90c4" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <text x="350" y="284" font-size="9" font-weight="700" fill="#4a90c4" text-anchor="middle">Vòng lặp phản hồi: mô hình cập nhật trở lại pipeline</text>

  <!-- ===== Example metrics panel ===== -->
  <rect x="20" y="308" width="640" height="128" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
  <text x="340" y="328" font-size="10" font-weight="700" fill="#333" text-anchor="middle">Ví dụ Chỉ số nhóm con được theo dõi mỗi cửa sổ suy luận</text>
  <line x1="30" y1="334" x2="650" y2="334" stroke="#bbb" stroke-width="0.8"/>

  <!-- Metric examples in three columns -->
  <!-- Col 1: Accuracy / Error -->
  <text x="90" y="352" font-size="9.5" font-weight="700" fill="#4a90c4" text-anchor="middle">Đồng đều độ chính xác</text>
  <text x="90" y="367" font-size="9" fill="#555" text-anchor="middle">|FPR_A − FPR_B| ≤ ε</text>
  <text x="90" y="381" font-size="9" fill="#555" text-anchor="middle">ngưỡng ε = 0.05</text>
  <text x="90" y="395" font-size="9" fill="#555" text-anchor="middle">Kiểm tra mỗi 1k yêu cầu.</text>

  <!-- Col 2: Calibration -->
  <text x="280" y="352" font-size="9.5" font-weight="700" fill="#3d9e5a" text-anchor="middle">Trôi dạt hiệu chuẩn</text>
  <text x="280" y="367" font-size="9" fill="#555" text-anchor="middle">|Pr(Y=1|score=s,G=g) − s|</text>
  <text x="280" y="381" font-size="9" fill="#555" text-anchor="middle">ECE per group ≤ 0.02</text>
  <text x="280" y="395" font-size="9" fill="#555" text-anchor="middle">Kiểm định KS cho phân phối</text>

  <!-- Col 3: Demographic parity -->
  <text x="470" y="352" font-size="9.5" font-weight="700" fill="#c87b2a" text-anchor="middle">Đồng đều nhân khẩu học</text>
  <text x="470" y="367" font-size="9" fill="#555" text-anchor="middle">|Pr(Ŷ=1|G=a) − Pr(Ŷ=1|G=b)|</text>
  <text x="470" y="381" font-size="9" fill="#555" text-anchor="middle">Chênh lệch đồng đều thống kê.</text>
  <text x="470" y="395" font-size="9" fill="#555" text-anchor="middle">Cửa sổ 24 giờ trượt</text>

  <!-- Column dividers -->
  <line x1="185" y1="338" x2="185" y2="428" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>
  <line x1="375" y1="338" x2="375" y2="428" stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="0.8"/>

  <!-- ===== Overhead annotations ===== -->
  <rect x="20" y="410" width="635" height="24" fill="#f9d6d5" stroke="#c44" stroke-width="0.8"/>
  <text x="340" y="426" font-size="9" fill="#a31f34" text-anchor="middle" font-weight="600">Chi phí giám sát: +10–20 ms mỗi suy luận · ~1.7 GB/ngày metadata với 864M suy luận hàng ngày · 150 chỉ số hoạt động mỗi triển khai 50 nhóm</text>

  <!-- ===== Bottom footnote ===== -->
  <text x="340" y="450" font-size="9" fill="#999" text-anchor="middle" font-style="italic">Mỗi khi vượt ngưỡng, cảnh báo kích hoạt huấn luyện lại hoặc hiệu chỉnh lại; mô hình cập nhật trở lại pipeline.</text>
</svg>