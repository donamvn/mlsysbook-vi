<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 800 480">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#fff"/>

  <!-- Column 1: Full Retraining -->
  <g transform="translate(80, 30)">
    <rect x="0" y="0" width="200" height="260" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <line x1="0" y1="36" x2="200" y2="36" stroke="#bbb" stroke-width="1.2"/>
    <text x="100" y="24" font-size="11" font-weight="700" fill="#333" text-anchor="middle">Huấn luyện lại toàn bộ</text>

    <!-- Diagram -->
    <rect x="20" y="50" width="70" height="60" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="55" y="65" font-size="9" fill="#555" text-anchor="middle">Tập dữ liệu</text>
    
    <rect x="30" y="70" width="50" height="20" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
    <text x="55" y="83" font-size="8" fill="#a31f34" text-anchor="middle">xóa</text>

    <line x1="90" y1="80" x2="108" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="110" y="60" width="70" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
    <text x="145" y="75" font-size="9" fill="#555" text-anchor="middle">Huấn luyện từ</text>
    <text x="145" y="87" font-size="9" fill="#555" text-anchor="middle">đầu</text>

    <!-- Properties -->
    <text x="100" y="130" font-size="9.5" font-weight="600" fill="#333" text-anchor="middle">Đặc tính</text>
    <line x1="20" y1="140" x2="180" y2="140" stroke="#bbb" stroke-width="0.8"/>

    <text x="20" y="160" font-size="9" fill="#555">Quên chính xác</text>
    <text x="20" y="175" font-size="9" fill="#555">Độ trung thực cao nhất</text>
    <text x="20" y="190" font-size="9" fill="#a31f34">Cực kỳ tốn kém</text>
    <text x="20" y="205" font-size="9" fill="#a31f34">Yêu cầu toàn bộ tập dữ liệu</text>

    <!-- Quality / Cost indicators -->
    <text x="100" y="230" font-size="9.5" font-weight="600" fill="#333" text-anchor="middle">Chất lượng: Chính xác</text>
    <text x="100" y="250" font-size="9.5" font-weight="600" fill="#a31f34" text-anchor="middle">Chi phí: 1 lần huấn luyện đầy đủ</text>
  </g>

  <!-- Column 2: Gradient Ascent -->
  <g transform="translate(320, 30)">
    <rect x="0" y="0" width="200" height="260" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <line x1="0" y1="36" x2="200" y2="36" stroke="#bbb" stroke-width="1.2"/>
    <text x="100" y="24" font-size="11" font-weight="700" fill="#333" text-anchor="middle">Gradient Ascent</text>

    <!-- Diagram -->
    <rect x="20" y="50" width="70" height="60" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
    <text x="55" y="65" font-size="9" fill="#555" text-anchor="middle">Quên</text>
    <text x="55" y="77" font-size="9" fill="#555" text-anchor="middle">đặt</text>
    <text x="55" y="95" font-size="8" fill="#a31f34" text-anchor="middle">tổn thất tối đa</text>

    <line x1="90" y1="80" x2="108" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="110" y="60" width="70" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
    <text x="145" y="75" font-size="9" fill="#555" text-anchor="middle">Cập nhật</text>
    <text x="145" y="87" font-size="9" fill="#555" text-anchor="middle">trọng số</text>

    <!-- Properties -->
    <text x="100" y="130" font-size="9.5" font-weight="600" fill="#333" text-anchor="middle">Đặc tính</text>
    <line x1="20" y1="140" x2="180" y2="140" stroke="#bbb" stroke-width="0.8"/>

    <text x="20" y="160" font-size="9" fill="#3d9e5a">Quên xấp xỉ</text>
    <text x="20" y="175" font-size="9" fill="#3d9e5a">Rất nhanh (phút)</text>
    <text x="20" y="190" font-size="9" fill="#555">Không cần tập dữ liệu</text>
    <text x="20" y="205" font-size="9" fill="#a31f34">Có thể giảm độ chính xác</text>

    <!-- Quality / Cost indicators -->
    <text x="100" y="230" font-size="9.5" font-weight="600" fill="#333" text-anchor="middle">Chất lượng: Xấp xỉ</text>
    <text x="100" y="250" font-size="9.5" font-weight="600" fill="#3d9e5a" text-anchor="middle">Chi phí: Phút</text>
  </g>

  <!-- Column 3: SISA Training -->
  <g transform="translate(560, 30)">
    <rect x="0" y="0" width="200" height="260" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <line x1="0" y1="36" x2="200" y2="36" stroke="#bbb" stroke-width="1.2"/>
    <text x="100" y="24" font-size="11" font-weight="700" fill="#333" text-anchor="middle">Huấn luyện SISA</text>

    <!-- Diagram -->
    <rect x="10" y="60" width="20" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="20" y="83" font-size="7.5" fill="#555" text-anchor="middle">S1</text>
    
    <rect x="40" y="60" width="20" height="40" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="50" y="83" font-size="7.5" fill="#555" text-anchor="middle">S2</text>
    
    <rect x="70" y="60" width="20" height="40" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
    <text x="80" y="83" font-size="7.5" fill="#a31f34" text-anchor="middle">S3</text>
    <text x="80" y="110" font-size="7.5" fill="#a31f34" text-anchor="middle">huấn luyện lại</text>

    <line x1="90" y1="80" x2="108" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="110" y="60" width="70" height="40" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
    <text x="145" y="75" font-size="9" fill="#555" text-anchor="middle">Huấn luyện lại</text>
    <text x="145" y="87" font-size="9" fill="#555" text-anchor="middle">shard 3</text>

    <!-- Properties -->
    <text x="100" y="130" font-size="9.5" font-weight="600" fill="#333" text-anchor="middle">Đặc tính</text>
    <line x1="20" y1="140" x2="180" y2="140" stroke="#bbb" stroke-width="0.8"/>

    <text x="20" y="160" font-size="9" fill="#3d9e5a">Chính xác (mỗi shard)</text>
    <text x="20" y="175" font-size="9" fill="#3d9e5a">Chi phí = 1 shard của toàn bộ</text>
    <text x="20" y="190" font-size="9" fill="#555">Yêu cầu thiết kế shard</text>
    <text x="20" y="205" font-size="9" fill="#555">Chi phí phụ Ensemble</text>

    <!-- Quality / Cost indicators -->
    <text x="100" y="230" font-size="9.5" font-weight="600" fill="#333" text-anchor="middle">Chất lượng: Chính xác (shard)</text>
    <text x="100" y="250" font-size="9.5" font-weight="600" fill="#3d9e5a" text-anchor="middle">Chi phí: 1 shard</text>
  </g>

  <!-- Comparison bars at bottom -->
  <!-- Time cost bars -->
  <g transform="translate(0, 320)">
    <text x="20" y="14" font-size="10" font-weight="700" fill="#333">Chi phí thời gian</text>

    <!-- Full Retraining -->
    <rect x="100" y="0" width="160" height="20" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
    <text x="180" y="14" font-size="9" font-weight="600" fill="#333" text-anchor="middle">Chạy toàn bộ</text>

    <!-- Gradient Ascent -->
    <rect x="380" y="0" width="40" height="20" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
    <text x="430" y="14" font-size="9" font-weight="600" fill="#333" text-anchor="start">~phút</text>

    <!-- SISA -->
    <rect x="610" y="0" width="40" height="20" fill="#cfe2f3" stroke="#4a90c4" stroke-width="1.5"/>
    <text x="660" y="14" font-size="9" font-weight="600" fill="#333" text-anchor="start">Một shard</text>
  </g>

  <!-- Quality bars -->
  <g transform="translate(0, 360)">
    <text x="20" y="14" font-size="10" font-weight="700" fill="#333">Chất lượng</text>

    <!-- Full Retraining -->
    <rect x="100" y="0" width="160" height="20" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="180" y="14" font-size="9" font-weight="600" fill="#333" text-anchor="middle">100% (chính xác)</text>

    <!-- Gradient Ascent -->
    <rect x="360" y="0" width="120" height="20" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="420" y="14" font-size="9" font-weight="600" fill="#333" text-anchor="middle">~80% (xấp xỉ)</text>

    <!-- SISA -->
    <rect x="580" y="0" width="160" height="20" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
    <text x="660" y="14" font-size="9" font-weight="600" fill="#333" text-anchor="middle">~95% (chính xác theo shard)</text>
  </g>

  <!-- Tradeoff annotation -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="680" height="40" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <text x="340" y="16" font-size="9.5" font-weight="600" fill="#a31f34" text-anchor="middle">Không gian đánh đổi: quên chính xác quá tốn kém ở quy mô lớn; phương pháp xấp xỉ đánh đổi</text>
    <text x="340" y="30" font-size="9.5" font-weight="600" fill="#a31f34" text-anchor="middle">đảm bảo toán học lấy tính khả thi thực tế theo yêu cầu quyền được lãng quên.</text>
  </g>

  <!-- Bottom annotation -->
  <text x="420" y="460" font-size="9" fill="#999" text-anchor="middle" font-style="italic">SISA chia dữ liệu huấn luyện thành các shard; chỉ shard bị ảnh hưởng cần huấn luyện lại khi xóa.</text>
</svg>