<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .section-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; text-anchor: middle; fill: #64748b; }
      .opt-hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 800; text-anchor: middle; }
      .opt-metric { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; font-weight: 700; }
      .annotation { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .flow-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>

    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="620" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(30, 18)">
    <rect width="860" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <rect x="14" y="13" width="96" height="20" rx="4" fill="#e0e7ff"/>
    <text x="62" y="26" text-anchor="middle" class="badge-text" fill="#4338ca">CHUYỂN ĐỔI MÔ HÌNH</text>
    <text x="126" y="24" class="title">Từ suy luận phi trạng thái đến quỹ đạo tác tử vòng kín</text>
    <text x="126" y="38" class="subtitle">Đối chiếu tối ưu cục bộ từng token với tối ưu hệ thống toàn cầu (hoàn thành tác vụ đầu cuối)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 1: TRADITIONAL AI (Stateless Request-Response)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 76)">
    <rect width="860" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Pill -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 850 0 C 855.523 0 860 4.477 860 10 L 860 32 L 0 32 Z" fill="#f1f5f9"/>
    <text x="20" y="21" class="section-hdr" fill="#334155">1. AI TRUYỀN THỐNG: YÊU CẦU-PHẢN HỒI PHI TRẠNG THÁI</text>
    <rect x="690" y="6" width="155" height="20" rx="4" fill="#e2e8f0"/>
    <text x="767" y="19" text-anchor="middle" class="badge-text" fill="#475569">Suy luận vòng hở</text>

    <!-- Pipeline Flow -->
    <!-- Input Box -->
    <g transform="translate(60, 50)">
      <rect width="125" height="48" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="62" y="26" class="node-text" fill="#1e293b">Đầu vào</text>
      <text x="62" y="40" class="node-sub">Lời nhắc / Truy vấn người dùng</text>
    </g>

    <!-- Arrow Input -> Model -->
    <line x1="185" y1="74" x2="330" y2="74" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="257" y="66" text-anchor="middle" class="annotation" font-size="10.5">token lời nhắc</text>

    <!-- Model Box -->
    <g transform="translate(330, 40)">
      <rect width="190" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="95" y="32" class="node-text" fill="#1e40af" font-size="14.5">Mô hình nền tảng</text>
      <text x="95" y="50" class="node-sub" fill="#2563eb">Chuyển tiếp / KV cache</text>
    </g>

    <!-- Arrow Model -> Output -->
    <line x1="520" y1="74" x2="665" y2="74" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="592" y="66" text-anchor="middle" class="annotation" font-size="10.5">token hoàn thành</text>

    <!-- Output Box -->
    <g transform="translate(665, 50)">
      <rect width="125" height="48" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="62" y="26" class="node-text" fill="#1e293b">Đầu ra</text>
      <text x="62" y="40" class="node-sub">Luồng văn bản / JSON</text>
    </g>

    <!-- Optimization Callout Bracket below Model -->
    <g transform="translate(310, 114)">
      <line x1="115" y1="0" x2="115" y2="10" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="0" y="10" width="230" height="42" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <text x="115" y="25" class="opt-hdr" fill="#1e40af">tối ưu cái này (Hiệu quả vi mô)</text>
      <text x="115" y="41" class="opt-metric" fill="#1d4ed8">FLOPs / token • joules / token</text>
    </g>
    
    <!-- Descriptive Notes on right -->
    <g transform="translate(585, 122)">
      <text x="0" y="13" class="annotation">• Một lượt chuyển tiếp; thu hồi activation dễ bay hơi</text>
      <text x="0" y="27" class="annotation">• Không trạng thái môi trường bền vững hoặc tự sửa lỗi</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL 2: AGENTIC AI (Closed-Loop Trajectory Execution)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 265)">
    <rect width="860" height="335" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.8" filter="url(#shadow)"/>
    
    <!-- Header Pill -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 850 0 C 855.523 0 860 4.477 860 10 L 860 32 L 0 32 Z" fill="#f5f3ff"/>
    <text x="20" y="21" class="section-hdr" fill="#5b21b6">2. AI TÁC TỬ: THỰC THI QUỸ ĐẠO VÒNG KÍN</text>
    <rect x="680" y="6" width="165" height="20" rx="4" fill="#ede9fe"/>
    <text x="762" y="19" text-anchor="middle" class="badge-text" fill="#6d28d9">Hệ thống phản hồi có trạng thái</text>

    <!-- Overarching Foundation Model Backbone Box -->
    <g transform="translate(195, 42)">
      <rect width="455" height="32" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="227" y="21" class="node-text" fill="#6d28d9" font-size="12">Xương sống mô hình nền tảng thần kinh (Công cụ chính sách nhận thức)</text>
      
      <!-- Downward connector lines to sub-components -->
      <line x1="60" y1="32" x2="60" y2="50" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <line x1="210" y1="32" x2="210" y2="50" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <line x1="360" y1="32" x2="360" y2="50" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    </g>

    <!-- Subsystem Nodes Row 1 -->
    <!-- Input Goal -->
    <g transform="translate(35, 92)">
      <rect width="105" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="52" y="25" class="node-text" fill="#1e293b">Mục tiêu đầu vào</text>
      <text x="52" y="40" class="node-sub">Mục tiêu người dùng</text>
    </g>

    <!-- Arrow Input -> Planner -->
    <line x1="140" y1="117" x2="195" y2="117" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

    <!-- Planner Node -->
    <g transform="translate(195, 92)">
      <rect width="120" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="60" y="25" class="node-text" fill="#5b21b6">Bộ lập kế hoạch</text>
      <text x="60" y="40" class="node-sub" fill="#7c3aed">Phân rã</text>
    </g>

    <!-- Arrow Planner -> Retrieval -->
    <line x1="315" y1="117" x2="350" y2="117" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

    <!-- Retrieval Node -->
    <g transform="translate(350, 92)">
      <rect width="120" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="60" y="25" class="node-text" fill="#5b21b6">Truy xuất</text>
      <text x="60" y="40" class="node-sub" fill="#7c3aed">Ngữ cảnh &amp; Bộ nhớ</text>
    </g>

    <!-- Arrow Retrieval -> Tool -->
    <line x1="470" y1="117" x2="505" y2="117" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

    <!-- Tool Execution Node -->
    <g transform="translate(505, 92)">
      <rect width="120" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
      <text x="60" y="25" class="node-text" fill="#92400e">Công cụ / Hành động</text>
      <text x="60" y="40" class="node-sub" fill="#b45309">Sandbox &amp; POSIX</text>
    </g>

    <!-- Row 2: Verification Node -->
    <!-- Downward arrows into Verification -->
    <path d="M 410 142 L 410 162 L 485 162" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="445" y="157" class="node-sub" font-size="8.5">Ngữ cảnh</text>

    <line x1="565" y1="142" x2="565" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="590" y="154" class="node-sub" font-size="8.5">Đột biến</text>

    <g transform="translate(485, 162)">
      <rect width="160" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="80" y="25" class="node-text" fill="#065f46">Oracle xác minh</text>
      <text x="80" y="41" class="node-sub" fill="#047857">Trình biên dịch, Linters &amp; Kiểm thử</text>
    </g>

    <!-- Arrow Verification -> Output (Terminal Success) -->
    <line x1="645" y1="188" x2="725" y2="188" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <rect x="652" y="172" width="65" height="15" rx="3" fill="#d1fae5"/>
    <text x="684" y="183" text-anchor="middle" class="flow-label" fill="#047857" font-size="8.5">ĐẠT / OK</text>

    <!-- Terminal Output Node -->
    <g transform="translate(725, 164)">
      <rect width="115" height="48" rx="6" fill="#f8fafc" stroke="#10b981" stroke-width="1.8"/>
      <text x="57" y="24" class="node-text" fill="#065f46">Đầu ra</text>
      <text x="57" y="39" class="node-sub" fill="#047857">Mục tiêu được chứng nhận</text>
    </g>

    <!-- Closed-Loop Feedback Path (Verification -> Planner on Retry / Incomplete) -->
    <path d="M 485 192 L 255 192 L 255 147" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
    
    <!-- Badge on Feedback Path -->
    <rect x="270" y="200" width="200" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="370" y="213" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#b91c1c">VÒNG LẶP PHẢN HỒI THỬ LẠI / LẬP KẾ HOẠCH LẠI</text>

    <!-- Optimization Callout for the Whole Loop -->
    <g transform="translate(130, 260)">
      <rect width="600" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="300" y="24" class="opt-hdr" fill="#065f46" font-size="14.5">tối ưu TOÀN BỘ VÒNG LẶP NÀY (Hiệu quả vĩ mô)</text>
      <text x="300" y="44" class="opt-metric" fill="#047857" font-size="13">joules / tác vụ hữu ích • chi phí / mục tiêu đã giải quyết • Thông lượng quỹ đạo</text>
    </g>
  </g>
</svg>